# Docker Compose for API-Only (Headless) Mode
#
# Usage, from `framework/Source`:
#   docker compose -f deploy/docker-compose.api-only.yml --project-directory . up
#
# `--project-directory` is REQUIRED: build contexts and mounts resolve against it, and Compose would
# otherwise default to this file's folder, which holds no Dockerfile.

services:
  api:
    build:
      context: ..
      target: base
    command: npm run start --workspace=@fromcode119/api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=production
      - API_URL=${API_PUBLIC_URL}
      - MARKETPLACE_URL=${MARKETPLACE_URL}
      - PLUGINS_DIR=/app/plugins
      - THEMES_DIR=/app/themes
      - APPEARANCE_DIR=/app/appearance
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - INTEGRATION_SECRET_KEY=${INTEGRATION_SECRET_KEY:-CHANGE_ME_INTEGRATION_SECRET_MIN_32_CHARS}
      - INTEGRATION_SECRET_MASK=${INTEGRATION_SECRET_MASK:-__FROMCODE_SAVED_SECRET__}
      # Shared secret for api -> admin/frontend calls (Settings -> Infrastructure restart buttons).
      # Same value on every service of the deployment; unset means those endpoints reject every call.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The admin and frontend are separate stacks here, so a Compose service name would not resolve.
      # Empty falls back to the public ADMIN_URL / FRONTEND_URL; set them to an address this container
      # can actually reach if the public hostnames are not routable from inside.
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - INTERNAL_FRONTEND_URL=${INTERNAL_FRONTEND_URL:-}
    depends_on:
      - db
      - redis
    volumes:
      - ../public/uploads:/app/public/uploads
      # ONE name per extension root — the container paths declared above as PLUGINS_DIR / THEMES_DIR /
      # APPEARANCE_DIR.
      - ../plugins:/app/plugins
      - ../themes:/app/themes
      - ../appearance:/app/appearance
    networks:
      - framework
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - framework
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - framework
    restart: unless-stopped

networks:
  framework:

volumes:
  postgres_data:
