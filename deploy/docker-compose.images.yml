# Deploy from PREBUILT images instead of building from source.
#
# Use it as an override on top of the full-stack file:
#
#   cd deploy
#   VERSION=v2.0.0 docker compose -f docker-compose.full-stack.yml -f docker-compose.images.yml pull
#   VERSION=v2.0.0 docker compose -f docker-compose.full-stack.yml -f docker-compose.images.yml up -d
#
# `build: !reset null` is doing the important work: without it Compose keeps the base file's build
# section, and `up` would rebuild from source instead of using the image you just pulled — the exact
# thing this file exists to avoid.
#
# The images are public, so no `docker login` is needed on the server.

services:
  api:
    build: !reset null
    image: ghcr.io/fromcode119/framework-api:${VERSION:-latest}

  # The one-shot that generates the bundled database's superuser password before the database is
  # initialised. It runs the api image because that is where the `fromcode` CLI lives — listing it
  # here is not optional: without the reset it would BUILD from source on a deployment whose whole
  # point is that it never builds anything, and the documented install would fail before `db` starts.
  extension-host:
    build: !reset null
    image: ghcr.io/fromcode119/framework-api:${VERSION:-latest}

  site-extension-host:
    build: !reset null
    image: ghcr.io/fromcode119/framework-api:${VERSION:-latest}

  db-secrets:
    build: !reset null
    image: ghcr.io/fromcode119/framework-api:${VERSION:-latest}

  admin:
    build: !reset null
    image: ghcr.io/fromcode119/framework-admin:${VERSION:-latest}

  frontend:
    build: !reset null
    image: ghcr.io/fromcode119/framework-frontend:${VERSION:-latest}

  # Only runs under the `single-domain` profile. A host with its own proxy in front never starts it.
  # The platform's own edge, from the gateway's image unless EDGE_IMAGE names another (see the
  # full-stack file: HAProxy, nginx… anything that meets the edge contract).
  edge:
    build: !reset null
    image: ${EDGE_IMAGE:-ghcr.io/fromcode119/framework-gateway:${VERSION:-latest}}

  gateway:
    build: !reset null
    image: ghcr.io/fromcode119/framework-gateway:${VERSION:-latest}

  # Installs new platform versions on this machine, as Settings → Updates decides: automatically, or when
  # an operator presses Update now; a release marked breaking always waits for the button. It rolls the
  # containers above to the new version the way the deploy command does — each new app starts beside the
  # running one, which stops only once the new one answers — waits for the api to report that version,
  # and rolls the old ones back if it does not. Where the deploy command would restart (deploy mode set
  # to restart, a migration the serving release cannot run beside, too little memory) it restarts too. It needs the Docker socket to do that, and this deployment's folder to
  # record the version in `.env` so a later `docker compose up` starts the same one.
  #
  # FROMCODE_UPDATER=off in `.env` stops it for a deployment that is updated some other way (a deploy
  # pipeline); the update screen then says so. ATLANTIS_UPDATER is the release-named spelling an
  # existing `.env` may still carry: both are passed through, the updater reads either, and unset
  # means on. (No nested `${A:-${B}}` default — not every compose this file meets resolves one.)
  updater:
    image: ghcr.io/fromcode119/framework-gateway:${VERSION:-latest}
    command: ./node_modules/.bin/tsx packages/cli/src/bin.ts system updater
    user: root
    environment:
      - FROMCODE_UPDATER=${FROMCODE_UPDATER:-}
      - ATLANTIS_UPDATER=${ATLANTIS_UPDATER:-}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      - UPDATER_API_URL=http://api:3000/api
      - UPDATER_ENV_FILE=/app/deploy-project/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data:/app/data:ro
      - .:/app/deploy-project
    depends_on:
      - api
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
