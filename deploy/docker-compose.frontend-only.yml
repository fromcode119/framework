# Docker Compose for Frontend-Only Mode
# Usage: docker-compose -f deploy/docker-compose.frontend-only.yml up

services:
  frontend:
    build:
      context: ..
      target: base
    command: npm run start --workspace=@fromcode119/frontend
    environment:
      - API_URL=${EXTERNAL_API_URL}
      - NEXT_PUBLIC_API_URL=${EXTERNAL_API_URL}
      # Shared secret for api -> admin/frontend calls (Settings -> Infrastructure restart buttons).
      # Same value on every service of the deployment; unset means those endpoints reject every call.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The frontend SERVER-RENDERS the active theme and the plugins' storefront surfaces, so it reads
      # those two roots off disk — the same container paths every other service declares. Without them
      # this app serves every page as an empty body, silently: the theme's server bundle cannot be
      # found and every SSR failure path is deliberately non-fatal.
      - THEMES_DIR=/app/themes
      - PLUGINS_DIR=/app/plugins
      - NODE_ENV=production
    volumes:
      # Read-only: the api owns installing and updating extensions; this app only renders from them.
      - ../themes:/app/themes:ro
      - ../plugins:/app/plugins:ro
    networks:
      - public
    restart: unless-stopped

networks:
  public:
    external: true
    name: web
