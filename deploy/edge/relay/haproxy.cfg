# The relay: holds this server's 80/443 and passes every connection, untouched, to the platform's edge.
# TCP only (the platform's gateway terminates TLS), with a PROXY protocol v2 header naming the visitor,
# which the platform reads because EDGE_TRUSTED_RELAYS lists this server. docs: deploy/DEPLOYMENT.md.

global
  log stdout format raw local0 warning

defaults
  mode tcp
  log global
  option dontlognull
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  timeout client-fin 10s
  timeout server-fin 10s
  retries 3

frontend http
  bind :80
  bind :::80 v6only
  default_backend platform_http

frontend https
  bind :443
  bind :::443 v6only
  default_backend platform_https

backend platform_http
  server platform "${EDGE_UPSTREAM_HOST}:80" check inter 5s send-proxy-v2

backend platform_https
  server platform "${EDGE_UPSTREAM_HOST}:443" check inter 5s send-proxy-v2
