# A RELAY: the platform's edge run on a separate server, in front of the platform's own edge. It holds
# this server's 80/443 and passes every connection, still encrypted, to the platform, with a PROXY
# protocol v2 header naming the visitor. It holds no certificates and routes nothing.
#
# On the platform, EDGE_TRUSTED_RELAYS must list this server's address, or the platform does not read
# the header and sees every visitor as this server. docs: deploy/DEPLOYMENT.md, "A relay in front of the edge".
#
# .env beside this file:
#   VERSION=<the platform's version>
#   EDGE_UPSTREAM_HOST=<the platform's public address>
services:
  relay:
    image: ghcr.io/fromcode119/framework-gateway:${VERSION:?set VERSION in .env}
    command: ./node_modules/.bin/tsx packages/cli/src/bin.ts system edge
    environment:
      - EDGE_HTTP_PORT=80
      - EDGE_HTTPS_PORT=443
      - EDGE_UPSTREAM_HOST=${EDGE_UPSTREAM_HOST:?set EDGE_UPSTREAM_HOST in .env}
      # The platform's public ports: its edge answers health checks on 80 and takes TLS on 443.
      - EDGE_UPSTREAM_HTTP_PORT=80
      - GATEWAY_TLS_PORT=443
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
