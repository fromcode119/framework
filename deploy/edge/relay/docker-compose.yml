# A RELAY: a separate server in front of the platform's own edge. It holds this server's 80/443 and
# passes every connection, still encrypted, to the platform, with a PROXY protocol v2 header naming
# the visitor. It holds no certificates and routes nothing (haproxy.cfg beside this file).
#
# On the platform, EDGE_TRUSTED_RELAYS must list this server's address, or the platform does not read
# the header and sees every visitor as this server. docs: deploy/DEPLOYMENT.md, "A relay in front of the edge".
#
# .env beside this file:
#   EDGE_UPSTREAM_HOST=<the platform's public address>
services:
  relay:
    image: haproxy:3.0-alpine
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    environment:
      - EDGE_UPSTREAM_HOST=${EDGE_UPSTREAM_HOST:?set EDGE_UPSTREAM_HOST in .env}
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # The visitor's own address must reach haproxy, and both IPv4 and IPv6 ports are bound.
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
