# Edge relay: holds every site's 80/443. Larger queues for bursts of new connections, shorter
# waits for half-open and closing ones, room for many tracked connections.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_fin_timeout = 15
net.netfilter.nf_conntrack_max = 262144
# Handing the ports from one edge process to the next (both listen with SO_REUSEPORT): connections
# still queued on the closing one move to the one staying, instead of being reset. Linux 5.14+.
# Measured on 2026-11-24, 4000 requests from 30 clients across a handover: 25 reset without, 0 with.
net.ipv4.tcp_migrate_req = 1
