# Addresses CrowdSec's own detection must never flag: the platform server, the relay itself, your
# other servers and the address you administer from. Replace the examples before starting CrowdSec.
# This covers local detection only — put the same addresses in the `never-block` ALLOWLIST too
# (deploy/DEPLOYMENT.md, "Protecting the relay"), which also overrides the community blocklist.
name: atlantis/never-block
description: "Never block the platform's own servers or its operator"
whitelist:
  reason: "platform infrastructure and operator"
  ip:
    - "192.0.2.10"   # the platform server
    - "192.0.2.20"   # this relay
    - "198.51.100.5" # the operator
