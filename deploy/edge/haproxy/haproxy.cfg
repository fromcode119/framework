# An ALTERNATIVE edge (the default is the platform's own, `atlantis system edge`). To use it, in .env:
#   EDGE_IMAGE=haproxy:3.0-alpine
#   EDGE_COMMAND=haproxy -f /app/deploy-edge/haproxy/haproxy.cfg
# Same contract as the default: holds the public ports and passes every connection, untouched, to a
# running gateway. It routes nothing — which host goes where is still decided by the gateway from the admin's
# host aliases. It exists so the gateway can be REPLACED with no gap: two gateways run side by side
# during a deploy, this sends new connections to whichever is up, and the old one drains and exits.
#
# TCP only, because the gateway terminates TLS itself. The visitor's address travels in the PROXY
# protocol header (send-proxy-v2), which the gateway reads — without it every visitor would appear to
# come from here.

global
  log stdout format raw local0 warning
  # The gateway's TLS port when the deployment did not say (GATEWAY_TLS_PORT in .env).
  presetenv GATEWAY_TLS_PORT 3443

defaults
  mode tcp
  log global
  option dontlognull
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  timeout client-fin 10s
  timeout server-fin 10s
  # A gateway that refuses a connection (stopping, or not up yet) is not an error for the visitor:
  # the connection goes to another one.
  retries 3
  option redispatch 1

# Docker's own DNS: `gateway` resolves to every running gateway container, re-read each second, so a
# new one is used as soon as it answers and a stopped one is dropped.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold obsolete 1s

frontend http
  bind :80
  default_backend gateway_http

frontend https
  bind :443
  default_backend gateway_https

backend gateway_http
  balance leastconn
  default-server check inter 1s fall 1 rise 1 resolvers docker init-addr none send-proxy-v2
  server-template gateway 4 gateway:3000

backend gateway_https
  balance leastconn
  default-server check inter 1s fall 1 rise 1 resolvers docker init-addr none send-proxy-v2
  server-template gateway 4 "gateway:${GATEWAY_TLS_PORT}"
