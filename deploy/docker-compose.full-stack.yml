# Docker Compose for Full-Stack Mode (API + Admin + Frontend)
#
# Usage, from `framework/Source`:
#   docker compose -f deploy/docker-compose.full-stack.yml --project-directory . up
#
# The `--project-directory` is REQUIRED, not decoration. Every path here — `build.context: .`, the
# `../plugins` mounts — resolves against the project directory, and Compose defaults that to THIS
# file's own folder, where there is no Dockerfile. Without the flag the build fails outright with
# "failed to read dockerfile". (On Coolify, set the base directory to `framework/Source`; the local
# dev stack achieves the same by including this file with `project_directory: .`.)
# Environment variables are injected via Coolify dashboard or a .env file at repo root.
# All paths are relative to the repo root (project-directory) — required for Coolify compatibility.
# Set COMPOSE_PROFILES=single-domain in Coolify only when you want the gateway service.
# This deploy file is for Coolify. Use the per-resource ingress network
# (`COOLIFY_RESOURCE_UUID`) so Traefik resolves the public service through the
# app-specific proxy network instead of the global `coolify` network, which can
# cause hostname collisions (for example `redis`).

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway-only
    profiles:
      - single-domain
    depends_on:
      - api
      - admin
      - frontend
    environment:
      - PORT=3000
      - API_URL=${API_URL:-http://api.framework.local}
      - ADMIN_URL=${ADMIN_URL:-http://admin.framework.local}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.framework.local}
      - API_TARGET_URL=http://api:3000
      - ADMIN_TARGET_URL=http://admin:3000
      - FRONTEND_TARGET_URL=http://frontend:3000
    ports:
      - ${GATEWAY_PORT:-80}:3000
    labels:
      - "traefik.docker.network=${COOLIFY_RESOURCE_UUID}"
    networks:
      - proxy
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/api
    # T5c: the container starts as root for exactly one fork (the privileged spawner that runs plugin
    # processes as their own users); the app itself drops to `node` at once. Root keeps only the
    # capabilities that fork needs — change identity (SETUID/SETGID), own the guests' directories
    # (CHOWN/FOWNER/DAC_OVERRIDE) and signal processes of other users (KILL) — and nothing may regain any.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
      # The guest egress rule in the entrypoint (iptables owner match) — root-only, applied once, before
      # the app drops privileges.
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fromcode}:${POSTGRES_PASSWORD:-ChangeMe_Pg_P@ssw0rd}@db:5432/${POSTGRES_DB:-fromcode}
      - DB_DIALECT=postgres
      # DDL connection: migrations and collection schema sync run as the role that OWNS the
      # schema, while DATABASE_URL serves requests as a non-owner role so row-level security
      # applies to them. Unset means both use DATABASE_URL — correct for single-tenant installs.
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_JWT_SECRET_MIN_32_CHARS}
      - NODE_ENV=production
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - API_URL=${API_URL:-http://api.framework.local}
      # The api builds links back into the admin (emails, notifications), so it needs the admin's
      # PUBLIC url — the internal one below is for server-to-server calls and is not a visitor address.
      - ADMIN_URL=${ADMIN_URL:-http://admin.framework.local}
      - MARKETPLACE_URL=${MARKETPLACE_URL:-https://marketplace.fromcode.com}
      - PLUGINS_DIR=/app/plugins
      - THEMES_DIR=/app/themes
      - APPEARANCE_DIR=/app/appearance
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - INTEGRATION_SECRET_KEY=${INTEGRATION_SECRET_KEY:-CHANGE_ME_INTEGRATION_SECRET_MIN_32_CHARS}
      - INTEGRATION_SECRET_MASK=${INTEGRATION_SECRET_MASK:-__FROMCODE_SAVED_SECRET__}
      # Shared secret the api presents when it calls the admin or frontend directly (Settings ->
      # Infrastructure restart buttons). Server-to-server only, never a browser credential. Set it in
      # the Coolify dashboard; the SAME value reaches all three services from there. Unset means those
      # endpoints reject every call, and the admin shows those buttons as unavailable.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # Where the api reaches the other two apps from inside this stack. Compose service names, the
      # same mechanism `INTERNAL_API_URL=http://api:3000` already relies on for admin -> api below, so
      # they resolve wherever that one does. Cleared falls back to the ADMIN_URL / FRONTEND_URL env
      # var — which is what a SPLIT deployment (separate Coolify resources) needs, since a service
      # name only resolves within its own stack.
      #
      # These are read from the ENVIRONMENT only, never from admin Settings: this address decides
      # where the shared secret above is sent, and a deployment that runs no frontend must resolve to
      # nothing rather than to whatever `site_url` happens to say.
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-http://admin:3000}
      - INTERNAL_FRONTEND_URL=${INTERNAL_FRONTEND_URL:-http://frontend:3000}
      # T5c: plugin processes get NO network of their own (the api makes their HTTP calls). `allow`
      # only for a deployment whose plugins still do raw network I/O; the entrypoint logs the policy.
      - GUEST_EGRESS_POLICY=${GUEST_EGRESS_POLICY:-deny}
    depends_on:
      - db
      - redis
    volumes:
      - ../public/uploads:/app/public/uploads
      # ONE name per extension root: the container path declared above as PLUGINS_DIR / THEMES_DIR.
      # A SHARED_*_DIR override was a SECOND name for the same thing, which let the api and the
      # frontend end up pointed at different directories with nothing to say so.
      - ../plugins:/app/plugins
      - ../themes:/app/themes
      - ../appearance:/app/appearance
    networks:
      - framework
      - proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/admin
    # T5c: starts as root only to drop to `node` (app-launcher); no guests, so no spawner capabilities.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      - API_URL=${INTERNAL_API_URL:-http://api:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - ADMIN_URL=${ADMIN_URL:-http://admin.framework.local}
      # Shared secret the api presents when it calls the admin or frontend directly (Settings ->
      # Infrastructure restart buttons). Server-to-server only, never a browser credential. Set it in
      # the Coolify dashboard; the SAME value reaches all three services from there. Unset means those
      # endpoints reject every call, and the admin shows those buttons as unavailable.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The admin renders appearance bundles, so it reads the same root the api installs them into.
      - APPEARANCE_DIR=/app/appearance
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    volumes:
      - ../appearance:/app/appearance
    networks:
      - framework
      - proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/frontend
    # T5c: the container starts as root for exactly one fork (the privileged spawner that runs theme
    # render hosts as their own user); the app itself drops to `node` at once. Root keeps only the
    # capabilities that fork needs — change identity (SETUID/SETGID), own the guests' directories
    # (CHOWN/FOWNER/DAC_OVERRIDE) and signal processes of other users (KILL) — and nothing may regain any.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
      # The guest egress rule in the entrypoint (iptables owner match) — root-only, applied once, before
      # the app drops privileges.
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - API_URL=${INTERNAL_API_URL:-http://api:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.framework.local}
      # Shared secret the api presents when it calls the admin or frontend directly (Settings ->
      # Infrastructure restart buttons). Server-to-server only, never a browser credential. Set it in
      # the Coolify dashboard; the SAME value reaches all three services from there. Unset means those
      # endpoints reject every call, and the admin shows those buttons as unavailable.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The frontend SERVER-RENDERS the active theme and the plugins' storefront surfaces, so it reads
      # the same two extension roots the api installs into — the same paths, under the same two names.
      # Without them this app renders every page as an empty body: the theme's server bundle cannot be
      # found, and every SSR failure path is deliberately non-fatal, so nothing anywhere says why.
      - THEMES_DIR=/app/themes
      - PLUGINS_DIR=/app/plugins
      - NODE_ENV=production
      - PORT=3000
      - GUEST_EGRESS_POLICY=${GUEST_EGRESS_POLICY:-deny}
    depends_on:
      - api
    volumes:
      # Read-only: the api owns installing and updating extensions; this app only renders from them.
      - ../themes:/app/themes:ro
      - ../plugins:/app/plugins:ro
    networks:
      - framework
      - proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fromcode}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMe_Pg_P@ssw0rd}
      - POSTGRES_DB=${POSTGRES_DB:-fromcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  framework:
  proxy:
    name: ${COOLIFY_RESOURCE_UUID}
    external: true

volumes:
  postgres_data:
