# Docker Compose for Full-Stack Mode (API + Admin + Frontend)
#
# Usage, from `framework/Source`:
#   docker compose -f deploy/docker-compose.full-stack.yml --project-directory . up
#
# The `--project-directory` is REQUIRED, not decoration. Every path here — `build.context: .`, the
# `../plugins` mounts — resolves against the project directory, and Compose defaults that to THIS
# file's own folder, where there is no Dockerfile. Without the flag the build fails outright with
# "failed to read dockerfile". (A build platform that asks for a "base directory" wants
# `framework/Source`; the local dev stack achieves the same by including this file with
# `project_directory: .`.)
# Environment variables come from the deployment platform's own environment settings, or a .env file
# at the repo root.
# All paths are relative to the repo root (project-directory), which is what a platform building from
# the repository root requires.
# Set COMPOSE_PROFILES=single-domain only when you want the gateway service.
# EXTERNAL_PROXY_NETWORK names the EXISTING docker network your reverse proxy is on, so it can resolve
# these services on a network it shares with them. Whatever you run in front — and this file does not
# care which — put its network's name here; `docker network ls` shows it. The variable is named after
# the ROLE, not after any product, so the same file works wherever it is deployed.
#
# If your platform creates a network per deployment, prefer that one over a global shared network:
# a shared network resolves by service NAME, so two stacks both running `redis` will collide.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway-only
    profiles:
      - single-domain
    depends_on:
      - api
      - admin
      - frontend
    environment:
      - PORT=3000
      - API_URL=${API_URL:-}
      - ADMIN_URL=${ADMIN_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - API_TARGET_URL=http://api:3000
      - ADMIN_TARGET_URL=http://admin:3000
      - FRONTEND_TARGET_URL=http://frontend:3000
      # WITHOUT THIS THE GATEWAY ROUTES BY PATH, NOT BY HOST, and says nothing about it. The routing
      # map is read from the api over the internal-service secret; with no secret the client is
      # disabled and the gateway silently falls back to single-domain path routing — which serves the
      # wrong app for a workspace host and looks like a routing bug rather than a missing variable.
      #
      # Set it and every service uses what you set. Leave it unset and the api generates one, which
      # this service adopts from the shared data directory below — which is why that volume is
      # mounted here and nowhere else in this file for the gateway.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # Set this and the gateway ALSO terminates TLS, serving the certificates the platform stores.
      # Unset (the default) it terminates nothing and behaves exactly as before, which is right for
      # every deployment whose reverse proxy holds the certificates.
      #
      # Without this line the variable can be set in `.env` and silently do nothing — compose only
      # passes what a service declares, so the feature looks switched on and is not.
      - GATEWAY_TLS_PORT=${GATEWAY_TLS_PORT:-}
    volumes:
      # Read-only, and only for `secrets.json`: this is how the gateway gets the internal secret when
      # the api generated it rather than an operator setting one.
      - ../data:/app/data:ro
    # The gateway is the ingress, so it listens where an ingress is expected: port 80. It only exists
    # under the `single-domain` profile, i.e. when you have asked for it to serve.
    #
    # Note what publishing means where a reverse proxy also fronts this stack (the `proxy` network
    # below): the published port answers directly, in FRONT of that proxy's TLS and access policy. On
    # such a host something already holds 80, so set GATEWAY_PORT to something else — or drop this
    # mapping and let the proxy reach the container over the network.
    # Bound to LOOPBACK by default. On a host where a reverse proxy already holds 80/443 — which is
    # every deployment that terminates TLS — publishing the gateway on 80 would put it in FRONT of
    # that proxy's TLS and access policy. The proxy reaches it over the network by name; the mapping
    # is here only so a bare deployment can still be curled locally.
    ports:
      - ${GATEWAY_PORT:-127.0.0.1:8085}:3000
    networks:
      - proxy
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/api
    # T5c: the container starts as root for exactly one fork (the privileged spawner that runs plugin
    # processes as their own users); the app itself drops to `node` at once. Root keeps only the
    # capabilities that fork needs — change identity (SETUID/SETGID), own the guests' directories
    # (CHOWN/FOWNER/DAC_OVERRIDE) and signal processes of other users (KILL) — and nothing may regain any.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
      # The guest egress rule in the entrypoint (iptables owner match) — root-only, applied once, before
      # the app drops privileges.
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      # Runtime traffic MUST use the non-owner role provisioned by the db init script below, so
      # PostgreSQL row-level security applies. Supply complete, URL-encoded connection strings in
      # the deployment environment; keeping credentials out of this interpolation also means a password
      # may contain characters that compose interpolation would otherwise mangle.
      # OPTIONAL since the first-run wizard existed. Set them and every service uses exactly what you
      # set — which is what every existing deployment does. Leave them unset and the api serves the
      # wizard instead, writes both connections into /app/data/database.json, and restarts into them.
      # NOT declared required: compose refuses to start before a container runs, so demanding them
      # here made the wizard unreachable — the process that would have written them never started.
      - DATABASE_URL=${DATABASE_URL:-}
      # OPTIONAL, and privileged: used once by the entrypoint to create the two logins above, then unset
      # before the app starts. Leave it unset wherever the operator creates roles themselves — every
      # managed database, and any deployment that provisioned them by hand.
      - DATABASE_BOOTSTRAP_URL=${DATABASE_BOOTSTRAP_URL:-}
      # DDL connection: migrations and collection schema sync run as the role that OWNS the
      # schema, while DATABASE_URL serves requests as a non-owner role so row-level security
      # applies to them. Unset means both use DATABASE_URL — correct for single-tenant installs.
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      # Where the bundled database lives, so the wizard can OFFER it and say exactly what it will
      # create. Container-internal coordinates only: no credential, and nothing an operator owns.
      # Blank on a deployment that ships no database of its own — the wizard then offers none rather
      # than pointing at a host that does not exist.
      - BUNDLED_DATABASE_HOST=db
      - BUNDLED_DATABASE_PORT=5432
      - BUNDLED_DATABASE_NAME=${POSTGRES_DB:-fromcode}
      # Read by the ENTRYPOINT, as root, to build the privileged connection that creates the two
      # roles — never by the application, which is why the file is owned by the database image's user.
      - BUNDLED_DATABASE_SUPERUSER=${POSTGRES_USER:-postgres}
      - BUNDLED_DATABASE_PASSWORD_FILE=/run/fromcode-db/superuser.password
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Generated on first boot into /app/data/secrets.json when unset, and reused from there. NOT
      # declared required: compose refuses to start before a container runs, so demanding it here
      # made a first install impossible — the process that would have created it never started.
      - JWT_SECRET=${JWT_SECRET:-}
      - NODE_ENV=production
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - API_URL=${API_URL:-}
      # The api builds links back into the admin (emails, notifications), so it needs the admin's
      # PUBLIC url — the internal one below is for server-to-server calls and is not a visitor address.
      - ADMIN_URL=${ADMIN_URL:-}
      # The STOREFRONT's public url. The api needs it for the CORS allowlist: a storefront loads its
      # theme bundle and fonts from the api host, which is a cross-origin request, and an origin the
      # api cannot name is refused. It was passed to the gateway and the frontend but not here, so
      # every storefront asset 500'd with "Not allowed by CORS" while the page itself rendered —
      # server-side HTML is fine and nothing hydrates, which looks like a theme fault and is not one.
      - FRONTEND_URL=${FRONTEND_URL:-}
      # Where to push a routing reload after a site is created, renamed or removed. Without it the
      # gateway still picks the change up, but only when its 30s cache expires — a new domain appears
      # to "not work yet" for half a minute, which is exactly long enough to be debugged twice.
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://gateway:3000}
      # Extra origins the api accepts, comma-separated, matched by suffix — so one entry covers every
      # site on a domain. On a multi-tenant deployment each site answers on its OWN host, and
      # FRONTEND_URL names only one of them; this is how an operator admits the rest.
      - CORS_ALLOWED_DOMAINS=${CORS_ALLOWED_DOMAINS:-}
      - MARKETPLACE_URL=${MARKETPLACE_URL:-https://marketplace.fromcode.com}
      - PLUGINS_DIR=/app/plugins
      - THEMES_DIR=/app/themes
      - APPEARANCE_DIR=/app/appearance
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - INTEGRATION_SECRET_KEY=${INTEGRATION_SECRET_KEY:-}
      # Read by the build server when a source stores no token of its own. Without it forwarded,
      # the documented "leave the token blank and GITHUB_TOKEN is used" fallback could never work in
      # a container: the variable existed on the host and nowhere the plugin could see it.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - INTEGRATION_SECRET_MASK=${INTEGRATION_SECRET_MASK:-__FROMCODE_SAVED_SECRET__}
      # Shared secret the api presents when it calls the admin or frontend directly (Settings ->
      # Infrastructure restart buttons). Server-to-server only, never a browser credential. Set it in
      # the deployment environment; the SAME value reaches all three services from there. Unset means those
      # endpoints reject every call, and the admin shows those buttons as unavailable.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # Where the api reaches the other two apps from inside this stack. Compose service names, the
      # same mechanism `INTERNAL_API_URL=http://api:3000` already relies on for admin -> api below, so
      # they resolve wherever that one does. Cleared falls back to the ADMIN_URL / FRONTEND_URL env
      # var — which is what a SPLIT deployment (each service deployed separately) needs, since a service
      # name only resolves within its own stack.
      #
      # These are read from the ENVIRONMENT only, never from admin Settings: this address decides
      # where the shared secret above is sent, and a deployment that runs no frontend must resolve to
      # nothing rather than to whatever `site_url` happens to say.
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-http://admin:3000}
      - INTERNAL_FRONTEND_URL=${INTERNAL_FRONTEND_URL:-http://frontend:3000}
      # T5c: plugin processes get NO network of their own (the api makes their HTTP calls). `allow`
      # only for a deployment whose plugins still do raw network I/O; the entrypoint logs the policy.
      - GUEST_EGRESS_POLICY=${GUEST_EGRESS_POLICY:-deny}
      - ENFORCE_AUTHZ_GATEWAY=true
      - ENFORCE_COLLECTION_READ_AUTHZ=true
      - ENFORCE_PLUGIN_INTEGRITY=true
    depends_on:
      - db
      - redis
    volumes:
      # Read by the ENTRYPOINT only, as root, to build the privileged connection that creates the two
      # database roles. The application drops to `node` immediately afterwards and the file is owned
      # by the database image's user, so the long-lived process cannot read this even though it is
      # mounted into its container.
      - db_secrets:/run/fromcode-db:ro
      - ../public/uploads:/app/public/uploads
      # Writable working space for anything that needs a scratch directory on disk rather than in the
      # database — the build agent clones repositories here, backups are staged here. The image has no
      # such directory and the app user cannot create one under /app, so a plugin that asked for it
      # failed at registration with EACCES on `/app/data`. Mounted, not baked, because its contents
      # are the deployment's and must survive an image upgrade.
      - ../data:/app/data
      # ONE name per extension root: the container path declared above as PLUGINS_DIR / THEMES_DIR.
      # A SHARED_*_DIR override was a SECOND name for the same thing, which let the api and the
      # frontend end up pointed at different directories with nothing to say so.
      - ../plugins:/app/plugins
      - ../themes:/app/themes
      # Installing a theme takes a safety copy of the one it replaces, into <projectRoot>/backups
      # (ThemeInstallerService -> BackupService.create). The api runs as `node` against a root-owned
      # /app, so with no mount here that copy failed with "EACCES: permission denied, mkdir
      # /app/backups" and the install died before it started. Mounted, not made non-fatal: a silent
      # install with no rollback copy is worse than a loud one that stops.
      - ../backups:/app/backups
      - ../appearance:/app/appearance
    networks:
      - framework
      - proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 768M was sized for ONE process. This container also runs an isolated process per active
          # plugin — each with its own 256 MB heap — and shells out to vite to build a plugin's admin
          # bundle. On staging, with twenty sources tracked, a `cms` build was killed mid-vite and
          # reported nothing: a killed child writes no stderr, so the failure arrived as a bare
          # "vite build (admin)" and looked like a code problem rather than a memory one.
          # The local compose already raised this for the same reason.
          memory: 2G

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/admin
    # T5c: starts as root only to drop to `node` (app-launcher); no guests, so no spawner capabilities.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      - API_URL=${INTERNAL_API_URL:-http://api:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-}
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - ADMIN_URL=${ADMIN_URL:-}
      # Shared secret the api presents when it calls the admin or frontend directly (Settings ->
      # Infrastructure restart buttons). Server-to-server only, never a browser credential. Set it in
      # the deployment environment; the SAME value reaches all three services from there. Unset means those
      # endpoints reject every call, and the admin shows those buttons as unavailable.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The admin renders appearance bundles, so it reads the same root the api installs them into.
      - APPEARANCE_DIR=/app/appearance
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    volumes:
      - ../appearance:/app/appearance
    networks:
      - framework
      - proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/frontend
    # T5c: the container starts as root for exactly one fork (the privileged spawner that runs theme
    # render hosts as their own user); the app itself drops to `node` at once. Root keeps only the
    # capabilities that fork needs — change identity (SETUID/SETGID), own the guests' directories
    # (CHOWN/FOWNER/DAC_OVERRIDE) and signal processes of other users (KILL) — and nothing may regain any.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
      # The guest egress rule in the entrypoint (iptables owner match) — root-only, applied once, before
      # the app drops privileges.
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - API_URL=${INTERNAL_API_URL:-http://api:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-}
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - FRONTEND_URL=${FRONTEND_URL:-}
      # Shared secret the api presents when it calls the admin or frontend directly (Settings ->
      # Infrastructure restart buttons). Server-to-server only, never a browser credential. Set it in
      # the deployment environment; the SAME value reaches all three services from there. Unset means those
      # endpoints reject every call, and the admin shows those buttons as unavailable.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The frontend SERVER-RENDERS the active theme and the plugins' storefront surfaces, so it reads
      # the same two extension roots the api installs into — the same paths, under the same two names.
      # Without them this app renders every page as an empty body: the theme's server bundle cannot be
      # found, and every SSR failure path is deliberately non-fatal, so nothing anywhere says why.
      - THEMES_DIR=/app/themes
      - PLUGINS_DIR=/app/plugins
      - NODE_ENV=production
      - PORT=3000
      # The islands document rollout. OFF serves every page through the App Router, which renders the
      # theme's server HTML and then REPLACES it with the live tree once the theme's bundles register
      # (`DynamicContentClient` -> `ServerMarkupHandoff`). That swap is why anything a script did to the
      # page is undone mid-load. ON rewrites content paths to `/fc-document`, which emits `#fc-root`
      # and the runtime entry, and `StorefrontHydrator` adopts the server markup in place with
      # `hydrateRoot` — one render, no swap. It logs `[frontend] hydration mode=...` on every boot, so
      # a page that quietly falls back to the old path says so in the console.
      - STOREFRONT_DOCUMENT_ISLANDS=${STOREFRONT_DOCUMENT_ISLANDS:-false}
      - GUEST_EGRESS_POLICY=${GUEST_EGRESS_POLICY:-deny}
    depends_on:
      - api
    volumes:
      # Read-only: the api owns installing and updating extensions; this app only renders from them.
      - ../themes:/app/themes:ro
      - ../plugins:/app/plugins:ro
    networks:
      - framework
      - proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Runs once, before the database, and usually does nothing.
  #
  # It exists for exactly one reason: the PostgreSQL image refuses to initialise without a password,
  # compose cannot generate one, and the api cannot either — it starts after the database it would be
  # generating the password for. So the last credential an operator had to invent by hand needed a
  # step that runs before both. It writes the file only if it is missing, because the password is what
  # the existing data directory was initialised with; regenerating it would lock everyone out.
  db-secrets:
    image: ${IMAGE_API:-fromcode-api}
    build:
      context: .
      dockerfile: Dockerfile
      target: api-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
    # As root, and briefly: the file it writes is owned by the database image's user, so neither this
    # container's app account nor the api's can read it afterwards.
    user: root
    entrypoint: ["npm", "run", "atlantis", "--", "db", "init-bundled-superuser", "--file", "/run/fromcode-db/superuser.password"]
    environment:
      # Set by a deployment that supplies its own superuser password. The one-shot stores it instead
      # of generating one, so this is still the value the database is created with.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - db_secrets:/run/fromcode-db
    networks:
      - framework
    restart: "no"

  db:
    image: postgres:15-alpine
    environment:
      # The image creates POSTGRES_USER as a SUPERUSER — that is unavoidable — so nothing else may use
      # it. The init script below spends it once, to create the two roles the framework actually runs
      # as, and neither application container ever receives these credentials.
      # Names, not secrets: both are shown in the setup wizard before anything is created, and both
      # may be set to whatever a deployment prefers.
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-fromcode}
      # ONLY the file, never POSTGRES_PASSWORD: this image REFUSES to start when both are set, so a
      # deployment that supplies its own password would have broken the moment the generated one
      # arrived. The one-shot above resolves that instead — it writes POSTGRES_PASSWORD into the file
      # when the operator set one, and generates a password only when nobody did. One mechanism, and
      # both deployments reach the image the same way.
      - POSTGRES_PASSWORD_FILE=/run/fromcode-db/superuser.password
      # The owner and runtime logins are NOT configured here. They are named, with their passwords, by
      # DATABASE_MIGRATION_URL and DATABASE_URL on the api service, and the api entrypoint creates them
      # from DATABASE_BOOTSTRAP_URL on every boot. Declaring them twice is how the two copies drift.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_secrets:/run/fromcode-db:ro
    depends_on:
      db-secrets:
        condition: service_completed_successfully
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  framework:
  proxy:
    # The boundary between the internet and these containers.
    #
    # WHOSE NETWORK IS IT? That is the only question here, and it has two answers. Behind a proxy you
    # already run, the network is THEIRS: name it and leave `PROXY_NETWORK_EXTERNAL` alone, and this
    # stack joins a network it did not create. On a bare host nobody owns one yet, so set
    # `PROXY_NETWORK_EXTERNAL=false` — as the shipped `.env.example` does — and compose creates it.
    # That is what removed `docker network create` from the install guide.
    #
    # The default is `true`, i.e. "somebody else's", because that is what every deployment written
    # before this line assumed: they set neither variable and must keep behaving identically. It also
    # fails in the safe direction — compose refuses to start on a missing network, loudly, rather
    # than quietly creating a second one beside the proxy's and serving nothing.
    #
    # A compose-created network must NOT already exist, which is the other half of why the default is
    # `true`: compose refuses to adopt a network it did not create ("exists but was not created by
    # compose"), so a host that already has one needs the external answer, not this one.
    name: ${EXTERNAL_PROXY_NETWORK:-atlantis-edge}
    external: ${PROXY_NETWORK_EXTERNAL:-true}

volumes:
  postgres_data:
  # Holds one file: the bundled database's superuser password. Separate from the app's data volume on
  # purpose — that one is chowned to the application user, and this credential must stay out of its
  # reach. The api mounts it read-only so the ENTRYPOINT (root) can read it before dropping privileges.
  db_secrets:
