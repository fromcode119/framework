# Docker Compose for API + Admin Mode
#
# Usage, from `framework/Source`:
#   docker compose -f deploy/docker-compose.api-admin.yml --project-directory . up
#
# `--project-directory` is REQUIRED: build contexts and mounts resolve against it, and Compose would
# otherwise default to this file's folder, which holds no Dockerfile.

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway-only
    environment:
      - PORT=3000
      - API_URL=${API_PUBLIC_URL}
      - ADMIN_URL=${ADMIN_PUBLIC_URL}
      - API_TARGET_URL=http://api:3000
      - ADMIN_TARGET_URL=http://admin:3000
    depends_on:
      - api
      - admin
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api-only
    command: npm run start --workspace=@fromcode119/api
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set the runtime DATABASE_URL in your deployment environment}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=production
      - API_URL=${API_PUBLIC_URL}
      - PLUGINS_DIR=/app/plugins
      - THEMES_DIR=/app/themes
      - APPEARANCE_DIR=/app/appearance
      - INTEGRATION_SECRET_KEY=${INTEGRATION_SECRET_KEY:?Set a unique INTEGRATION_SECRET_KEY of at least 32 characters}
      - INTEGRATION_SECRET_MASK=${INTEGRATION_SECRET_MASK:-__FROMCODE_SAVED_SECRET__}
      # Shared secret for api -> admin/frontend calls (Settings -> Infrastructure restart buttons).
      # Same value on every service of the deployment; unset means those endpoints reject every call.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The admin is in THIS stack, so its service name resolves. The frontend is deployed separately
      # here, where a service name would not resolve across stacks — leave it empty and the framework
      # falls back to the public FRONTEND_URL, or set it to an address the api can actually reach.
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-http://admin:3000}
      - INTERNAL_FRONTEND_URL=${INTERNAL_FRONTEND_URL:-}
    depends_on:
      - db
      - redis
    volumes:
      - ../public/uploads:/app/public/uploads
      # ONE name per extension root — the container paths declared above as PLUGINS_DIR / THEMES_DIR /
      # APPEARANCE_DIR. Every service that reads a root mounts that same path.
      - ../plugins:/app/plugins
      - ../themes:/app/themes
      - ../appearance:/app/appearance
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: Dockerfile
      target: admin-only
    command: npm run start --workspace=@fromcode119/admin
    environment:
      - API_URL=http://api:3000
      - NEXT_PUBLIC_API_URL=${API_PUBLIC_URL}
      - ADMIN_URL=${ADMIN_PUBLIC_URL}
      # Shared secret for api -> admin/frontend calls (Settings -> Infrastructure restart buttons).
      # Same value on every service of the deployment; unset means those endpoints reject every call.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # The admin renders appearance bundles, so it reads the same root the api installs them into.
      - APPEARANCE_DIR=/app/appearance
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    volumes:
      - ../appearance:/app/appearance
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
