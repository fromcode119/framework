# Local development stack — `docker compose up` from `framework/Source`.
#
# This file is NOT a topology. Which services exist, how they are built, and how they are wired lives
# ONCE, in `deploy/docker-compose.full-stack.yml` — the file production actually runs. This file
# includes that and states only what DEVELOPMENT does differently: SQLite instead of Postgres, the
# *.framework.local hostnames and their Traefik routes, the local marketplace, relaxed enforcement
# flags, dev-only keys, and the host paths of this checkout.
#
# It used to be a second full copy of that topology, and the two drifted exactly as duplicated
# configuration always does: the frontend's THEMES_DIR/PLUGINS_DIR and its themes/plugins mounts
# existed HERE and not in the deploy file, so the storefront server-rendered locally and served
# content-free HTML in production — for months, silently, because every SSR failure path is non-fatal.
# Keep this file a delta. Anything that belongs to the topology belongs in the deploy file, where
# production will get it too.

name: framework

include:
  # `project_directory: .` makes the included file's relative paths resolve from framework/Source —
  # the same base production runs it with, which is why `build.context: .` finds the Dockerfile that
  # lives here and not in deploy/. The few host paths this checkout keeps elsewhere are re-stated
  # below; Compose merges volumes BY TARGET, so each replaces the included mount for that container
  # path rather than adding a second one.
  - path: deploy/docker-compose.full-stack.yml
    project_directory: .

services:
  # T6: the platform gateway is the ONE upstream Traefik forwards every framework.local host to. It
  # routes by host from the tenant table (`GET /internal/routing`): site hosts → frontend, workspace
  # hosts → admin, `api.` aliases → api, the platform's own hosts as configured. api/admin/frontend
  # are no longer exposed to Traefik directly (see their `traefik.enable=false` below).
  gateway:
    environment:
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      - GATEWAY_ROUTING_TTL_MS=${GATEWAY_ROUTING_TTL_MS:-30000}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-gateway.rule=Host(`${GATEWAY_HOST:-framework.local}`) || HostRegexp(`^[a-z0-9.-]+\\.framework\\.local$`)"
      - "traefik.http.routers.fc-framework-gateway.priority=1"
      - "traefik.http.routers.fc-framework-gateway.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-gateway.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.services.fc-framework-gateway.loadbalancer.server.port=3000"

  api:
    # T5: isolated plugins are separate processes INSIDE this container — one per ACTIVE plugin, each
    # with its own heap ceiling (Settings → Infrastructure → Plugin Isolation). The base file's 768M
    # was sized for one process; this checkout runs seven active plugins plus the api itself.
    deploy:
      resources:
        limits:
          memory: 2G
    # PLUGIN-owned env vars (a plugin's API credentials or signing key) reach the api through this, so
    # the framework's compose never names an individual plugin's key. `required: false` so a checkout
    # without the file still starts.
    env_file:
      - path: plugins.env
        required: false
    environment:
      # SQLite by default locally: no Postgres to run, and the file lives in the ./data mount below.
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/app.db}
      - DB_DIALECT=${DB_DIALECT:-sqlite}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.framework.local}
      - CORS_ALLOWED_DOMAINS=${CORS_ALLOWED_DOMAINS:-framework.local,api.framework.local,admin.framework.local,frontend.framework.local,localhost}
      - MARKETPLACE_URL=${MARKETPLACE_URL:-http://marketplace.framework.local}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.framework.local}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      # T6: where the api pushes "the tenant table changed" so the gateway re-reads its routing map.
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://gateway:3000}
      # A directory-checksum mismatch re-stamps rather than disabling the plugin — local source edits
      # change the hash constantly. Real tamper protection is signature signing.
      - ENFORCE_PLUGIN_INTEGRITY=${ENFORCE_PLUGIN_INTEGRITY:-false}
      # Both default-deny gates stay ON locally, so what is verified here is what production enforces.
      - ENFORCE_AUTHZ_GATEWAY=${ENFORCE_AUTHZ_GATEWAY:-true}
      - ENFORCE_COLLECTION_READ_AUTHZ=${ENFORCE_COLLECTION_READ_AUTHZ:-true}
      # PRIVATE files. Outside /app/public/uploads — that tree is served by express.static before
      # cookies, CSRF and auth exist, so anything inside it is anonymous by construction.
      - STORAGE_PRIVATE_DIR=${STORAGE_PRIVATE_DIR:-/app/storage/private}
    extra_hosts:
      # The local marketplace runs on the host, not in this network.
      - "marketplace.framework.local:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./storage/private:/app/storage/private
      # Backups — system snapshots AND tenant exports. Without this mount every export a delete wrote as
      # its "undo" vanished the next time the api container was recreated (seen 2026-09-05).
      - ./backups:/app/backups
      # This checkout's extension roots. Same container paths as production; different host location.
      - ../../plugins:/app/plugins
      - ../../themes:/app/themes
      - ../../appearance:/app/appearance
    labels:
      # T6: reached through the platform gateway only.
      - "traefik.enable=false"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-api.rule=Host(`${API_HOST:-api.framework.local}`)"
      - "traefik.http.routers.fc-framework-api.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-api.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.services.fc-framework-api.loadbalancer.server.port=3000"

  admin:
    build:
      args:
        - NEXT_PUBLIC_ADMIN_AI_ENABLED=${NEXT_PUBLIC_ADMIN_AI_ENABLED:-false}
        - NEXT_PUBLIC_ADMIN_APPEARANCE=${ADMIN_APPEARANCE:-}
    environment:
      - NEXT_PUBLIC_ADMIN_AI_ENABLED=${NEXT_PUBLIC_ADMIN_AI_ENABLED:-false}
    volumes:
      - ../../appearance:/app/appearance
    labels:
      # T6: reached through the platform gateway only.
      - "traefik.enable=false"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-admin.rule=Host(`${ADMIN_HOST:-admin.framework.local}`)"
      - "traefik.http.routers.fc-framework-admin.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-admin.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.routers.fc-framework-admin.priority=100"
      - "traefik.http.services.fc-framework-admin.loadbalancer.server.port=3000"

  frontend:
    volumes:
      - ../../themes:/app/themes:ro
      - ../../plugins:/app/plugins:ro

    labels:
      # T6: reached through the platform gateway only.
      - "traefik.enable=false"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      # Every SITE is its own host on the storefront (T3/T4: `_system_tenants.primary_host` + aliases), so
      # the storefront router matches any `*.framework.local` that no other router claims. Priority 1 puts
      # it BELOW the admin, api and marketplace routers, whose exact Host() rules win first.
      - "traefik.http.routers.fc-framework-frontend.rule=Host(`${FRONTEND_HOST:-frontend.framework.local}`) || HostRegexp(`^[a-z0-9-]+\\.framework\\.local$`)"
      - "traefik.http.routers.fc-framework-frontend.priority=1"
      - "traefik.http.routers.fc-framework-frontend.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-frontend.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.services.fc-framework-frontend.loadbalancer.server.port=3000"

  # DEV DELTA: publish Postgres to the host so the tenant-isolation suite can connect as the runtime
  # role from outside the containers. Production keeps the database unpublished — it is reachable
  # only on the internal network there, which is why this belongs here and not in the deploy file.
  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"


# The edge proxy this checkout shares with the other local stacks. Production names it after the
# Coolify resource instead, which is why the name has to be stated here rather than inherited.
networks:
  proxy:
    external: true
    name: ${EXTERNAL_PROXY_NETWORK:-proxy}
