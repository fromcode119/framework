# Docker Compose for Full-Stack Mode (API + Admin + Frontend)
# Usage: docker compose -f deploy/docker-compose.full-stack.yml up
# Environment variables are injected via Coolify dashboard or a .env file at repo root.
# All paths are relative to the repo root (project-directory) — required for Coolify compatibility.

name: framework

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway-only
    profiles:
      - single-domain
    depends_on:
      - api
      - admin
      - frontend
    environment:
      - PORT=3000
      - API_URL=${API_URL:-http://api.framework.local}
      - ADMIN_URL=${ADMIN_URL:-http://admin.framework.local}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.framework.local}
      - API_TARGET_URL=http://api:3000
      - ADMIN_TARGET_URL=http://admin:3000
      - FRONTEND_TARGET_URL=http://frontend:3000
    ports:
      - ${GATEWAY_PORT:-80}:3000
    networks:
      - framework
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-gateway.rule=Host(`${GATEWAY_HOST:-framework.local}`)"
      - "traefik.http.routers.fc-framework-gateway.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-gateway.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.services.fc-framework-gateway.loadbalancer.server.port=3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/api
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/app.db}
      - DB_DIALECT=${DB_DIALECT:-sqlite}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_JWT_SECRET_MIN_32_CHARS}
      - NODE_ENV=production
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - API_URL=${API_URL:-http://api.framework.local}
      - ADMIN_URL=${ADMIN_URL:-http://admin.framework.local}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.framework.local}
      - CORS_ALLOWED_DOMAINS=${CORS_ALLOWED_DOMAINS:-framework.local,api.framework.local,admin.framework.local,frontend.framework.local,localhost}
      - MARKETPLACE_URL=${MARKETPLACE_URL:-http://marketplace.framework.local}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.framework.local}
      - PLUGINS_DIR=/app/plugins
      - THEMES_DIR=/app/themes
      - APPEARANCE_DIR=/app/appearance
      # Plugin integrity: a directory-checksum mismatch (extra/changed files, or a core
      # upgrade changing the hash recipe) NO LONGER disables the plugin — by default the
      # framework re-stamps the checksum from the on-disk content and loads it. Set this to
      # `true` ONLY if you want strict mode: a mismatch hard-fails (disables) the plugin.
      # Real tamper protection is signature signing (ENFORCE_PLUGIN_SIGNATURES), which a core
      # upgrade cannot false-positive. Leave false unless you have a specific reason.
      - ENFORCE_PLUGIN_INTEGRITY=${ENFORCE_PLUGIN_INTEGRITY:-false}
      # Default-deny authorization gateway: every plugin API route + collection read requires an explicit
      # access declaration (public/authenticated/self/permission); undeclared => admin-only. Off falls back
      # to legacy per-route guards. See SECURITY-AUTHZ-REMEDIATION-PLAN.md.
      # Default-deny plugin-route authz. Secure-by-default (ON). Set to false to fall back to legacy
      # per-route guards. Verified live 2026-07-01: anon → public routes work, admin routes 401.
      - ENFORCE_AUTHZ_GATEWAY=${ENFORCE_AUTHZ_GATEWAY:-true}
      # Collection READ lockdown. Content collections that must be public declare `static access =
      # { read: () => true }` (cms pages/posts/categories/tags/navigation/post-meta, ecommerce
      # products/categories/product-tags/reviews, lms catalog). Everything else is admin-read.
      # Secure-by-default (ON). If a public frontend surface 404s, tag its collection then keep this on.
      - ENFORCE_COLLECTION_READ_AUTHZ=${ENFORCE_COLLECTION_READ_AUTHZ:-true}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - INTEGRATION_SECRET_KEY=${INTEGRATION_SECRET_KEY:-CHANGE_ME_INTEGRATION_SECRET_MIN_32_CHARS}
      - INTEGRATION_SECRET_MASK=${INTEGRATION_SECRET_MASK:-__FROMCODE_SAVED_SECRET__}
      # AI provider + keys are NOT env vars — they're configured securely in the admin via the
      # `ai` integration (IntegrationManager), encrypted with INTEGRATION_SECRET_KEY above.
    depends_on:
      - db
      - redis
    extra_hosts:
      - "marketplace.framework.local:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ${SHARED_PLUGINS_DIR:-../../plugins}:/app/plugins
      - ${SHARED_THEMES_DIR:-../../themes}:/app/themes
      - ${SHARED_APPEARANCE_DIR:-../../appearance}:/app/appearance
    networks:
      - framework
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-api.rule=Host(`${API_HOST:-api.framework.local}`)"
      - "traefik.http.routers.fc-framework-api.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-api.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.services.fc-framework-api.loadbalancer.server.port=3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
        - NEXT_PUBLIC_ADMIN_AI_ENABLED=${NEXT_PUBLIC_ADMIN_AI_ENABLED:-false}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
        - NEXT_PUBLIC_ADMIN_APPEARANCE=${ADMIN_APPEARANCE:-}
    command: npm run start --workspace=@fromcode119/admin
    environment:
      - API_URL=${INTERNAL_API_URL:-http://api:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
      - NEXT_PUBLIC_ADMIN_AI_ENABLED=${NEXT_PUBLIC_ADMIN_AI_ENABLED:-false}
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - ADMIN_URL=${ADMIN_URL:-http://admin.framework.local}
      - NODE_ENV=production
      - PORT=3000
      - APPEARANCE_DIR=/app/appearance
    depends_on:
      - api
    volumes:
      - ${SHARED_APPEARANCE_DIR:-../../appearance}:/app/appearance
    networks:
      - framework
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-admin.rule=Host(`${ADMIN_HOST:-admin.framework.local}`)"
      - "traefik.http.routers.fc-framework-admin.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-admin.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.routers.fc-framework-admin.priority=100"
      - "traefik.http.services.fc-framework-admin.loadbalancer.server.port=3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-only
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
        - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
        - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
    command: npm run start --workspace=@fromcode119/frontend
    environment:
      - API_URL=${INTERNAL_API_URL:-http://api:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://api.framework.local}
      - API_VERSION_PREFIX=${API_VERSION_PREFIX:-v1}
      - NEXT_PUBLIC_API_VERSION=${API_VERSION_PREFIX:-v1}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.framework.local}
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    networks:
      - framework
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${EXTERNAL_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.fc-framework-frontend.rule=Host(`${FRONTEND_HOST:-frontend.framework.local}`)"
      - "traefik.http.routers.fc-framework-frontend.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.fc-framework-frontend.tls=${TRAEFIK_TLS_ENABLED:-true}"
      - "traefik.http.services.fc-framework-frontend.loadbalancer.server.port=3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fromcode}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMe_Pg_P@ssw0rd}
      - POSTGRES_DB=${POSTGRES_DB:-fromcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    networks:
      - framework
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  framework:
  proxy:
    external: true
    name: ${EXTERNAL_PROXY_NETWORK:-proxy}

volumes:
  postgres_data:
