# A FIRST INSTALL, built from this checkout — what someone sees who has never run this before.
#
# Why it exists: the published images are `linux/amd64` only, so a fresh install could not be tried on
# an arm64 machine at all, and the only place to test one was a real server. Two bugs lived in that
# gap and neither could appear on an existing deployment, because every one of those sets the secrets
# in its environment: the gateway never received the secret the api generates, so it could not fetch a
# routing map and `/` answered 404; and adopting that secret once at startup missed it anyway, because
# compose waits for a container to START, not for what it WRITES.
#
# Deliberately NOT the dev stack. No source mounts, no hot reload, nothing from `.env`: the point is
# to boot the way a stranger's machine would, with an empty database and nothing configured.
#
#   docker compose -f docker-compose.fresh.yml -p fc-fresh up -d --build
#   open http://localhost:8099          # the wizard, on a bare address
#   docker compose -f docker-compose.fresh.yml -p fc-fresh down -v   # and it is gone, volumes included
#
# `-p fc-fresh` is not optional: it keeps this stack's containers, network and volumes away from the
# dev stack's. `down -v` is how you get a genuinely fresh install again — without it the database
# survives, the platform is already set up, and the thing you meant to test cannot happen.
services:
  db:
    image: postgres:16-alpine
    environment:
      # The bootstrap superuser, and the only credential a first install cannot generate for itself:
      # postgres needs it at container init, before any of our code runs. The owner and app roles it
      # creates are a different matter — those are what row-level security depends on.
      POSTGRES_USER: fromcode
      POSTGRES_PASSWORD: fromcode
      POSTGRES_DB: fromcode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fromcode"]
      interval: 3s
      retries: 30
    volumes:
      - fresh_db:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-only
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://fromcode:fromcode@db:5432/fromcode
      DB_DIALECT: postgres
      NODE_ENV: production
      # NO urls and NO secrets. That is the whole point: the api generates the secrets into
      # /app/data on first boot, and the platform's own addresses are settled in the wizard.
    volumes:
      - fresh_data:/app/data
      - fresh_themes:/app/themes
      - fresh_plugins:/app/plugins

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-only
    depends_on: [api]
    environment:
      API_URL: http://api:3000
      NODE_ENV: production

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway-only
    depends_on: [api, admin]
    environment:
      API_TARGET_URL: http://api:3000
      ADMIN_TARGET_URL: http://admin:3000
    # The SAME data volume as the api: this is how the gateway gets the internal secret the api
    # generated. Without it there is no routing map, and a platform nobody has set up answers 404.
    volumes:
      - fresh_data:/app/data
    ports:
      - "8099:3000"

volumes:
  fresh_db:
  fresh_data:
  fresh_themes:
  fresh_plugins:
