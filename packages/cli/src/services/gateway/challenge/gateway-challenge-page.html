<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{title}}</title>
<style nonce="{{nonce}}">
  :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --line: #e2e8f0; --accent: #4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2937; --accent: #818cf8; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
  p { margin: 0; color: var(--muted); }
  .host { margin-top: 20px; font-size: 13px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; margin: 0 auto 20px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h1>{{title}}</h1>
  <p>{{message}}</p>
  <p class="host">{{host}}</p>
</main>
<script nonce="{{nonce}}">
(function () {
  // SHA-256 over an ASCII string, as eight 32-bit words. The gateway checks the same digest.
  function sha256(ascii) {
    function rotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var maxWord = Math.pow(2, 32), words = [], bitLength = ascii.length * 8, i, j;
    var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k.length, isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
    words[words.length] = (bitLength / maxWord) | 0;
    words[words.length] = bitLength;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var temp1 = hash[7] + (rotate(e, 6) ^ rotate(e, 11) ^ rotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
          + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rotate(w15, 7) ^ rotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rotate(w2, 17) ^ rotate(w2, 19) ^ (w2 >>> 10))) | 0);
        var temp2 = (rotate(a, 2) ^ rotate(a, 13) ^ rotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    return hash;
  }
  var token = {{token}}, bits = {{bits}}, back = {{back}}, verify = {{verify}}, nonce = 0;
  function work() {
    for (var end = nonce + 15000; nonce < end; nonce++) {
      if ((sha256(token + ':' + nonce)[0] >>> (32 - bits)) === 0) {
        location.replace(verify + '?t=' + encodeURIComponent(token) + '&n=' + nonce + '&r=' + encodeURIComponent(back));
        return;
      }
    }
    setTimeout(work, 0);
  }
  setTimeout(work, 300);
})();
</script>
</body>
</html>
