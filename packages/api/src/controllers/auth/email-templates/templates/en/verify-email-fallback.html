{{#if logoUrl}}<p><img src="{{logoUrl}}" alt="{{appName}}" height="40" style="display:block;height:40px;width:auto;border:0;" /></p>{{/if}}
<p>{{#if user.firstName}}Hi {{user.firstName}},{{else}}Hi,{{/if}}</p>
<p>Please verify your email by clicking the button below.</p>
<p><a href="{{verificationUrl}}" style="display:inline-block;padding:10px 16px;background:#4f46e5;color:#fff;text-decoration:none;border-radius:8px;">Verify Email</a></p>
<p>If the button does not work, copy and paste this URL:</p>
<p>{{verificationUrl}}</p>
