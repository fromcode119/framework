{{#if logoUrl}}<p><span style="display:table;padding:8px 12px;border-radius:8px;background-color:#ffffff;background-image:linear-gradient(#ffffff,#ffffff);"><img src="{{logoUrl}}" alt="{{appName}}" height="40" style="display:block;height:40px;width:auto;border:0;" /></span></p>{{/if}}
<p>{{#if user.firstName}}Hi {{user.firstName}},{{else}}Hi,{{/if}}</p>
<p>Use the button below to confirm your new email address.</p>
<p><a href="{{confirmUrl}}" style="display:inline-block;padding:10px 16px;background:#4f46e5;color:#fff;text-decoration:none;border-radius:8px;">Confirm Email Change</a></p>
<p>If the button does not work, copy and paste this URL:</p>
<p>{{confirmUrl}}</p>
