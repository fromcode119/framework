# Develop against THIS checkout without ever building a Docker image.
#
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d admin api
#
# Two kinds of change, two loops, neither of them an image build:
#
#   An APP's own code (packages/admin/app|components|lib, packages/api/src)
#     → save the file. The dev server reloads. Nothing else to do.
#
#   A shared LIBRARY (core, database, auth, sdk, react, queue)
#     → npm run build --workspace=@fromcode119/core     # seconds: tsc, not Docker
#       docker restart framework-api-1                  # ~15s
#
# The libraries are mounted as their BUILT `dist`, not their `src`, and that is the whole trick.
# `@fromcode119/core` resolves through `main: dist/index.js`, so plugins load dist no matter what. An
# earlier version of this file mounted `core/src`, which made `tsx watch` run core from src while every
# plugin still loaded core from dist — two copies of core in one process, so two copies of its
# singletons (the service registry, TenantMode, the AsyncLocalStorage request context). Registrations
# made in one were invisible to the other and every plugin failed to register: 11 errors, 0 active.
# Mounting dist keeps ONE copy, which is what makes this safe.
#
# `node_modules` and `.next` stay inside the container: mounting the host's over them makes a Linux
# container try to run macOS-built binaries.
#
# Back to the built images:  docker compose -f docker-compose.yml up -d admin api
services:
  admin:
    command: ["npm", "run", "dev", "--workspace=@fromcode119/admin"]
    environment:
      - NODE_ENV=development
      # Next's dev server watches the mounted tree; polling is what makes that work across a bind mount.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./packages/admin/app:/app/packages/admin/app
      - ./packages/admin/components:/app/packages/admin/components
      - ./packages/admin/lib:/app/packages/admin/lib
      - ./packages/core/dist:/app/packages/core/dist
      - ./packages/react/dist:/app/packages/react/dist
      - ./packages/sdk/dist:/app/packages/sdk/dist

  api:
    command: ["npm", "run", "dev", "--workspace=@fromcode119/api"]
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/core/dist:/app/packages/core/dist
      - ./packages/database/dist:/app/packages/database/dist
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/queue/dist:/app/packages/queue/dist
      - ./packages/sdk/dist:/app/packages/sdk/dist
