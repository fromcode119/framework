# Run the apps from THIS checkout with hot reload, instead of rebuilding an image for every change.
#
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d --no-deps admin
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d --no-deps api
#
# `--no-deps` matters: `up admin` without it also recreates the api, because admin depends on it.
#
# Both dev servers work. Four bugs stood between this file and a working dev loop, all fixed 2026-09-07:
#
#   admin   1. reactor's barrel exported `Reactor` (a React class component), `Context` and
#              `react-dom/client`, so any server module importing `Enum` from it hit React's server-
#              component check. The React-free pieces now live behind `@fromcode119/react-class-components/lang`, the
#              DOM root factories behind `ReactDomRoots`, and the middleware imports its two core
#              utilities directly instead of through core's `client` barrel.
#           2. next-build-codegen's source-contract loader was a normal rule sitting first in the list, so it ran
#              LAST — after Next had already read an unstamped `.client.tsx`. It is a `pre` loader now.
#
#   api     3. `tsx` applies its tsconfig only to files matching that config's `include`, so every
#              package outside `api/src` compiled with esbuild's DEFAULT standard decorators and every
#              reactor decorator got no descriptor. `tsconfig.dev.json` widens `include`.
#           4. A guest is a plain `node` process: it needs core's BUILT entry even when the host runs
#              from `src` (`PluginHost.guestMainPath()`), and an in-process plugin must load its packed
#              `index.js` rather than the `.ts` tsx re-points it to (`PluginEntryModuleLoader`).
#
# WHAT THIS FILE ALREADY FIXES: the 512 MB limit the deploy file gives these services is sized for
# `next start`. Under `next dev` the admin was OOM-killed mid-compile and restarted forever, which
# looked like "the dev server starts and never serves" (Traefik answered 502). With the limit raised it
# stays up and answers — which is how the four failures above became visible at all.
#
# Plugin guests always run core's BUILT dist (they are separate `node` processes); after changing core
# code a guest depends on, run `npm run build --workspace=@fromcode119/core`. Everything the api itself
# runs comes from the mounted source.
#
# Back to the built images:  docker compose -f docker-compose.yml up -d admin api
services:
  admin:
    command: ["npm", "run", "dev", "--workspace=@fromcode119/admin"]
    environment:
      - NODE_ENV=development
      # Next's dev server watches the mounted tree; polling is what makes that work across a bind mount.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # The admin aliases `@fromcode119/react-class-components` to that package's SRC, so the dev server
      # compiles these files directly — mount them and a change there needs no build at all. (Unlike core: core
      # resolves through dist, so mounting core/src would give plugins one copy and the watcher another.)
      - ./packages/react-class-components/src:/app/packages/react-class-components/src
      # The admin compiles core from SRC as well (next.config aliases `@fromcode119/core` to it), so a
      # new constant or client util is invisible here until this is mounted — the admin silently built
      # a URL from `undefined`.
      - ./packages/core/src:/app/packages/core/src
      # ...and @fromcode119/react, which the admin also aliases to SRC. Without it a change to the
      # runtime bridge or the plugin JSX shim is invisible here until the image is rebuilt.
      - ./packages/react/src:/app/packages/react/src
      # react-class-components' package.json carries the `./lang` subpath export the middleware graph
      # imports; the next.config resolves the package from that src. Both are read at startup, so they must be mounted
      # for a config or subpath change to take effect without rebuilding the image.
      - ./packages/react-class-components/package.json:/app/packages/react-class-components/package.json
      - ./packages/admin/next.config.js:/app/packages/admin/next.config.js
      # next.config.js is only half the config: every shared decision it makes (dev origins, aliases,
      # base path) lives in config/next-config-env.js. Mounting the one without the other means a change
      # to the shared half silently runs against the image's baked copy — which is how the workspace
      # hosts stayed blocked after their fix was written.
      - ./config:/app/config
      - ./packages/admin/app:/app/packages/admin/app
      - ./packages/admin/components:/app/packages/admin/components
      - ./packages/admin/lib:/app/packages/admin/lib
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    command: ["npm", "run", "dev", "--workspace=@fromcode119/api"]
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/api/src:/app/packages/api/src
      # The api's `tsx watch` resolves `@core/*` to core's SOURCE, so mount it and a core change needs no
      # build. Plugin GUESTS are separate `node` processes and still load core's built `dist` — that split
      # is inherent to the isolation, not caused by this mount, and it is why `PluginHost.guestMainPath()`
      # points the guest at `dist` even when the host itself is running from `src`.
      - ./packages/core/src:/app/packages/core/src
      # The api registers the extension builder at bootstrap, and runs from SOURCE via tsx — so the
      # package has to be reachable inside the container. It is a WORKSPACE, absent from any image
      # built before it existed: without this mount the api dies at boot with MODULE_NOT_FOUND for
      # @fromcode119/extension-builder. `dist` is what the api imports, so mount the whole package.
      - ./packages/extension-builder:/app/packages/extension-builder
      # ...and core's BUILT output, because a plugin guest is a separate `node` process that loads core
      # from `dist`. Without this the host runs your edited `src` while every guest runs the image's
      # baked `dist` — two different versions of the same protocol in one request. That is not
      # hypothetical: it silently 401'd every guarded plugin route the moment the host started writing
      # the forwarded user in a new encoding the stale guests could not read.
      # So core's dist must stay fresh: after changing core, run
      #   npm run build --workspace=@fromcode119/core
      #
      # Do NOT try to automate that with `typescript-multiple-inheritance build -w`. `typescript-multiple-inheritance build` REWRITES the sources in place
      # (alias specifiers → relative paths), runs tsc, and restores them in a `finally`. With `-w` tsc
      # never returns, so the restore never runs — and killing the watcher leaves every source file in
      # its rewritten state. It cost this repo ~5,200 import lines of its alias style, silently.
      - ./packages/core/dist:/app/packages/core/dist
      # Same reason as core: the root tsconfig maps `@fromcode119/auth` to its SRC, so this is the copy
      # the dev server actually runs. Without it an auth change is invisible until the image is rebuilt.
      - ./packages/auth/src:/app/packages/auth/src
      # `tsx watch` reads both at startup: the dev script and the wide-`include` tsconfig that makes
      # tsx apply legacy decorators to EVERY package's source, not just the api's own.
      - ./packages/api/package.json:/app/packages/api/package.json
      - ./packages/api/tsconfig.dev.json:/app/packages/api/tsconfig.dev.json
    deploy:
      resources:
        limits:
          memory: 4G
