# Run the apps from THIS checkout with hot reload, instead of rebuilding an image for every change.
#
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d --no-deps admin
#   docker compose -f docker-compose.yml -f docker-compose.sources.yml up -d --no-deps api
#
# `--no-deps` matters: `up admin` without it also recreates the api, because admin depends on it.
#
# STATUS — both dev servers are blocked by pre-existing bugs, diagnosed 2026-09-07. Neither is caused
# by this file, and each is a small fix away:
#
#   admin   `next dev --webpack` fails with "You're importing a module that depends on `createContext`
#           into a React Server Component module". `next build` does not, so the two pipelines disagree
#           about where the "use client" boundary is — nextor's UseClientPlugin runs in the build path.
#           Fix that and this file works for admin.
#
#   api     `tsx watch src/server.ts` boots, serves /health, and then fails EVERY plugin:
#           "Failed to initialize extension ai: Cannot read properties of undefined (reading 'value')"
#           — an Enum member resolving undefined, i.e. reactor or core loaded twice under tsx. Verified
#           with NO volumes mounted at all, so it is the dev script itself, not the mounts.
#
# WHAT THIS FILE ALREADY FIXES: the 512 MB limit the deploy file gives these services is sized for
# `next start`. Under `next dev` the admin was OOM-killed mid-compile and restarted forever, which
# looked like "the dev server starts and never serves" (Traefik answered 502). With the limit raised it
# stays up and answers — which is how the two failures above became visible at all.
#
# Only each app's OWN source is mounted. Do NOT add `packages/core/src`: core resolves through
# `main: dist/index.js`, so plugins load dist while a watcher would run src — two copies of every
# singleton in one process, and every plugin fails to register.
#
# Back to the built images:  docker compose -f docker-compose.yml up -d admin api
services:
  admin:
    command: ["npm", "run", "dev", "--workspace=@fromcode119/admin"]
    environment:
      - NODE_ENV=development
      # Next's dev server watches the mounted tree; polling is what makes that work across a bind mount.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./packages/admin/app:/app/packages/admin/app
      - ./packages/admin/components:/app/packages/admin/components
      - ./packages/admin/lib:/app/packages/admin/lib
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    command: ["npm", "run", "dev", "--workspace=@fromcode119/api"]
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/api/src:/app/packages/api/src
    deploy:
      resources:
        limits:
          memory: 4G
