# Releases an extension (plugin, theme, appearance) when its default branch moves. Each extension's own
# `release.yml` calls this job; the framework holds no list of their names.
#
# THE VERSION IS SET HERE, NOT IN THE PULL REQUEST. Every change used to bump its own `manifest.json`, and
# parallel sessions kept taking the same number: the push gate refused the second one ("already on main"),
# which meant a rebase, a re-bump and a second full gate run for a one-line fix. A change that forgot to bump
# shipped nothing at all, silently (the tag already existed). Now a merge that changes what ships gets the
# next patch number above the newest tag, committed to the branch and tagged in one step. A version a change
# did raise itself (a minor or major step) is kept as it is.
#
# What does NOT ship — docs, CI files, tests — releases nothing, exactly as before.
name: Extension release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    # One release at a time per repository: two merges a minute apart must not both pick the same number.
    concurrency:
      group: extension-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide the version
        id: version
        run: |
          set -euo pipefail
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q "origin/$GITHUB_REF_NAME"   # the branch as it is NOW, not as it was when this run was queued

          file=''
          for f in manifest.json theme.json appearance.json; do [ -f "$f" ] && { file=$f; break; }; done
          [ -n "$file" ] || { echo "no manifest.json / theme.json / appearance.json" >&2; exit 1; }

          current=$(jq -r '.version' "$file")
          case "$current" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "$file version is not a plain x.y.z version: $current" >&2; exit 1 ;; esac

          last_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last_tag" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"; echo "version=$current" >> "$GITHUB_OUTPUT"; echo "bump=false" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nothing that ships changed since the last release → nothing to release.
          shipped=$(git diff --name-only "$last_tag" HEAD | grep -vE '(^|/)(tests?|__tests__)/|\.test\.[a-z]+$|\.md$|^\.github/|^\.gitignore$' || true)
          if [ -z "$shipped" ]; then
            echo "Only tests / docs / CI changed since $last_tag — no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=${last_tag#v}
          newest=$(printf '%s\n%s\n' "$current" "$last" | sort -V | tail -1)
          if [ "$current" = "$newest" ] && [ "$current" != "$last" ]; then
            next=$current; bump=false               # the change raised the version itself; keep it
          else
            IFS=. read -r ma mi pa <<< "$last"
            next="$ma.$mi.$((pa + 1))"; bump=true
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      # The version commit is created through the GitHub API with the workflow token, NOT with `git push`.
      # Sources builds only SIGNED commits (proof a change came through GitHub), and GitHub signs a commit
      # only when a bot creates it through the API — a pushed commit is unsigned, so the first releases
      # made by this job installed nothing ("commit … is not signed").
      - name: Write the version
        if: steps.version.outputs.release == 'true' && steps.version.outputs.bump == 'true'
        env:
          FILE: ${{ steps.version.outputs.file }}
          OLD: ${{ steps.version.outputs.previous }}
          NEW: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `pageRelease` names the release that prepared a stored page; it moves with the version.
          tmp=$(mktemp)
          jq --indent 2 --arg old "$OLD" --arg new "$NEW" \
            '.version = $new | walk(if type == "object" and .pageRelease == $old then .pageRelease = $new else . end)' \
            "$FILE" > "$tmp" && mv "$tmp" "$FILE"
          repo="repos/$GITHUB_REPOSITORY/git"
          base=$(git rev-parse HEAD)
          # Sign only on top of a SIGNED head (a pull-request merge always is). Otherwise this job would
          # hand Sources a signed tip over a commit pushed straight to the branch — the one it must refuse.
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$base" -q .commit.verification.verified)" = true ] \
            || { echo "Head $base is not signed — not releasing on top of it." >&2; exit 1; }
          blob=$(base64 < "$FILE" | tr -d '\n' | jq -Rn '{content: input, encoding: "base64"}' | gh api "$repo/blobs" --input - -q .sha)
          tree=$(jq -n --arg base "$(git rev-parse 'HEAD^{tree}')" --arg path "$FILE" --arg sha "$blob" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' | gh api "$repo/trees" --input - -q .sha)
          commit=$(jq -n --arg msg "chore(release): $NEW" --arg tree "$tree" --arg parent "$base" \
            '{message: $msg, tree: $tree, parents: [$parent]}' | gh api "$repo/commits" --input - -q .sha)
          # Fast-forward only: a merge that landed meanwhile makes this fail rather than be overwritten.
          # The workflow token's update starts no other workflow, so this cannot loop.
          gh api -X PATCH "$repo/refs/heads/$BRANCH" -f sha="$commit" -F force=false >/dev/null
          # `reset --hard`, not `checkout`: the edit above left this file changed in the working tree, and
          # `git checkout` then refuses to move onto a commit that touches it ("local changes would be
          # overwritten"), which failed every release that actually bumped a version. The commit carries
          # exactly the content that was uploaded, so there is nothing here worth keeping.
          git fetch -q origin "$BRANCH" && git reset -q --hard "$commit"

      # A branch whose head is still an UNSIGNED release commit (made by this job before it signed its
      # commits) is one Sources refuses to build. Put a signed commit with the same content on top.
      - name: Sign an unsigned release head
        if: steps.version.outputs.release == 'false'
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          read -r verified login message < <(gh api "repos/$GITHUB_REPOSITORY/commits/$head" \
            -q '"\(.commit.verification.verified) \(.author.login // "-") \(.commit.message|split("\n")[0])"')
          case "$verified $login $message" in
            "false github-actions[bot] chore(release): "*) ;;
            *) exit 0 ;;
          esac
          # Re-sign ONLY this job's own version commit: it changes the version file alone and sits on a
          # signed parent. Anything else unsigned at the head stays unsigned, and Sources keeps refusing it.
          files=$(git diff --name-only "$head^" "$head")
          case "$files" in manifest.json|theme.json|appearance.json) ;; *) echo "Unsigned head changes $files — not signing." >&2; exit 1 ;; esac
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head^" -q .commit.verification.verified)" = true ] \
            || { echo "Parent of $head is not signed — not signing." >&2; exit 1; }
          # The author and message can be set by anyone; the CONTENT cannot hide. Outside `version` and
          # `pageRelease` the file must be byte-for-byte its signed parent's, so signing adds nothing new.
          strip='del(.version) | walk(if type == "object" then del(.pageRelease) else . end)'
          # Fail closed: a file that is missing or does not parse stops here instead of comparing equal-empty.
          parent_json=$(git show "$head^:$files" | jq -eS "$strip")
          head_json=$(git show "$head:$files" | jq -eS "$strip")
          [ -n "$parent_json" ] && [ "$parent_json" = "$head_json" ] \
            || { echo "Unsigned head changes more than the version in $files — not signing." >&2; exit 1; }
          repo="repos/$GITHUB_REPOSITORY/git"
          commit=$(jq -n --arg msg "$message" --arg tree "$(git rev-parse 'HEAD^{tree}')" --arg parent "$head" \
            '{message: $msg, tree: $tree, parents: [$parent]}' | gh api "$repo/commits" --input - -q .sha)
          gh api -X PATCH "$repo/refs/heads/$BRANCH" -f sha="$commit" -F force=false >/dev/null
          echo "Signed $message as $commit"

      - name: Create tag and release
        if: steps.version.outputs.release == 'true'
        env:
          TAG_NAME: v${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q .; then
            echo "$TAG_NAME already exists"; exit 0
          fi
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
