# Refuses any commit that credits an AI.
#
# WHY THIS EXISTS: the marker outlives the session. A `Co-Authored-By: Claude` trailer or a
# `🤖 Generated with` line ends up in the permanent history of the repo, and from there in GitHub's
# CONTRIBUTOR GRAPH — where it cannot be removed, because the bot commits survive in `refs/pull/N/head`
# and GitHub never deletes a pull-request ref. Not for the owner, not via the API, not by force-push.
#
# That is the whole point: by the time you see the bot in the contributors list it is already too late
# to take it out. Cleaning it up in 2026-08 (Copilot) and again in 2026-09 (Claude) each cost a history
# rewrite that still did not clear it. The only real fix is never letting it merge.
name: No AI attribution

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # NAMED explicitly: this string is the status-check context the branch ruleset requires. Leaving
    # it to default to the job id makes the required check a bare "check", which is both meaningless
    # in the UI and easy to break by renaming the job.
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full range being proposed, not just the tip — a clean head commit says nothing about
          # the five behind it, and every one of them lands in history on merge.
          fetch-depth: 0

      - name: Reject AI attribution in commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            RANGE="$BASE..$HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1 || RANGE="${{ github.sha }} -1"
          fi

          echo "Checking: $RANGE"

          # ANCHORED. A real trailer starts its own line; prose that merely NAMES one does not.
          # The first version of this file matched anywhere in the body and blocked its own commit,
          # whose message explains what a `Co-Authored-By` trailer is. A guard that fires on the
          # documentation of the thing it guards is a guard people switch off.
          TRAILER='^[[:space:]]*(co-authored-by|signed-off-by):[[:space:]]*.*(claude|copilot|chatgpt|gpt-[0-9]|gemini|cursor|devin|anthropic)'
          # A generation footer is also its own line, and only ever appears as one.
          FOOTER='^[[:space:]]*(🤖[[:space:]]*)?generated with \[?(claude|copilot)'
          # Identity is a whole field, so it needs no anchor — a bot cannot author under a human name.
          IDENTITY='copilot|copilot-swe-agent|noreply@anthropic\.com|claude\[bot\]'

          FAILED=0
          for sha in $(git rev-list $RANGE); do
            WHO="$(git log -1 --format='%an%n%ae%n%cn%n%ce' "$sha")"
            BODY="$(git log -1 --format='%B' "$sha")"
            HIT=""
            echo "$WHO"  | grep -qiE "$IDENTITY" && HIT="authored or committed by a bot"
            echo "$BODY" | grep -qiE "$TRAILER"  && HIT="carries an AI co-author trailer"
            echo "$BODY" | grep -qiE "$FOOTER"   && HIT="carries an AI generation footer"
            if [ -n "$HIT" ]; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") — $HIT"
              { echo "$WHO"; echo "$BODY"; } | grep -iE "$TRAILER|$FOOTER|$IDENTITY" | sed 's/^/    /'
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            cat <<'MSG'

          ────────────────────────────────────────────────────────────────
          This commit credits an AI, and that credit is PERMANENT once merged.

          It reaches GitHub's contributor graph through `refs/pull/N/head`, which
          GitHub never deletes — not for the repo owner, not by force-push, not via
          the API. Removing it afterwards has twice required rewriting history, and
          twice failed to clear the cached contributor list.

          Fix the commits before merging:

            git rebase -i <base>            # reword, or
            git filter-branch --msg-filter 'grep -viE "co-authored-by: (claude|copilot)"' <base>..HEAD

          The code is yours. It should not carry a record of how it was typed.
          ────────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

          echo "No AI attribution found."

      # The commit scan above cannot see this: the `🤖 Generated with [Claude Code]` footer is
      # usually put in the PULL REQUEST BODY, which is not part of any commit. It never reaches the
      # contributor graph, but it sits on the public PR page forever and is the marker people
      # actually notice.
      - name: Reject AI attribution in the pull request body
        if: github.event_name == 'pull_request'
        env:
          # Passed through env, never interpolated into the script. A PR body is attacker-controlled
          # text; `${{ }}` inside a run block would paste it straight into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # ANCHORED, for the same reason the commit patterns are: the real footer is always its own
          # line, and a body that merely DESCRIBES the footer must not be blocked by it.
          FOOTER='^[[:space:]]*[-*>]?[[:space:]]*(🤖[[:space:]]*)?generated (with|by) \[?(claude|copilot|chatgpt|gemini|cursor|devin)'
          TRAILER='^[[:space:]]*co-authored-by:[[:space:]]*.*(claude|copilot|chatgpt|gpt-[0-9]|gemini|cursor|devin|anthropic)'
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE "$FOOTER|$TRAILER"; then
            echo "::error::The pull request title or body credits an AI."
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -inE "$FOOTER|$TRAILER" | sed 's/^/    /'
            echo "Edit the pull request description and remove the line. The code is yours."
            exit 1
          fi
          echo "No AI attribution in the pull request body."

      # And the third surface: a byline inside the source itself. These outlive the session in a way
      # a commit message does not — they are read by everyone who opens the file.
      - name: Reject AI attribution in added source lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            RANGE="$BASE $HEAD"
          else
            RANGE="${{ github.event.before }} ${{ github.sha }}"
            git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1 || RANGE="${{ github.sha }}^ ${{ github.sha }}"
          fi

          # Only ADDED lines, and only ones shaped like a comment making an authorship claim. A file
          # that merely mentions Claude in prose is not a byline. This workflow itself is excluded
          # because it necessarily contains every string it bans — the previous version of this guard
          # blocked its own commit for exactly that reason.
          BYLINE='^\+.*(//|#|/\*|\*|<!--|--)[[:space:]]*.*((ai|machine)[- ]generated|(generated|written|authored|created|added|produced) (by|with) (an? )?(ai|llm|assistant|claude|copilot|chatgpt|gpt-[0-9]|gemini|cursor|devin|anthropic))'

          HITS="$(git diff --unified=0 $RANGE -- . ':(exclude).github/workflows/no-ai-attribution.yml' \
                  | grep -inE "$BYLINE" || true)"

          if [ -n "$HITS" ]; then
            echo "::error::An added line marks the source as AI-written."
            echo "$HITS" | sed 's/^/    /'
            echo "Delete the byline. Describe what the code does, never who or what typed it."
            exit 1
          fi
          echo "No AI attribution in added source lines."
