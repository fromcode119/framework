name: Auto Tag version

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'packages/*/package.json'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pkg_version.outputs.VERSION }}
      created: ${{ steps.check_tag.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: pkg_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.pkg_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.pkg_version.outputs.VERSION }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # Build and publish the images for the tag that was just created.
  #
  # This must be a `uses:` call rather than letting publish-images.yml watch for the tag push:
  # the tag above is pushed with GITHUB_TOKEN, and GitHub does not raise workflow-triggering events
  # for GITHUB_TOKEN actions. Without this job, tagging would succeed and nothing would ever build.
  publish:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      version: v${{ needs.tag.outputs.version }}
