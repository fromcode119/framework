# Runs the framework's own test suite.
#
# WHY THIS EXISTS: nothing ran it. The repository had four workflows — guards, tagging, attribution
# and images — and not one of them invoked vitest, so 3,053 tests existed and none of them had an
# opinion about a pull request. `Arch guard` is a static gate; it type-checks and measures structure,
# and says nothing about behaviour.
#
# AND WHY IT BRINGS SERVICES: 34 of those tests are integration suites that SKIP unless the thing they
# test is reachable, which is the honest design — a green run against no database is worse than no
# test. But skipping was the only thing that ever happened, including for `tenant-isolation`, which is
# the proof that row-level security keeps one customer's rows away from another. The services below
# are what turn "skipped" into "passed".
name: Tests

#
# PULL REQUESTS ONLY: a squash merge lands exactly the tree its pull request already passed, so a second
# run on main repeated the same minutes before every release. The arch guards and the attribution check
# still run on main as well.
on:
  pull_request:

jobs:
  # BUILD ONCE, SHARE WITH THE SHARDS. The packages, the storefront runtime bundle and the CLI take
  # ~100 s to build and are identical for every shard, so they are built here a single time and handed
  # over as one archive of everything the build wrote (all git-ignored, non-`node_modules` files).
  # Listing the outputs by rule rather than by path means a new package's `dist` cannot be forgotten.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the framework
        uses: actions/checkout@v5

      # 22, matching NODE_BASE_IMAGE in the Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The suite imports BUILT output for the packages that ship as `dist` (core, react, sdk).
      - name: Build the packages the tests import
        run: npm run build:packages

      # `frontend-runtime-bundle.test.ts` deliberately fails when the bundle has not been built.
      - name: Build the storefront runtime bundle
        run: npm run build:frontend-runtime

      # `fromcode db` runs the roles and migrations the shards set up.
      - name: Build the CLI
        run: npm run build --workspace=@fromcode119/cli

      - name: Archive the build output
        run: |
          git ls-files --others --ignored --exclude-standard | grep -Ev '(^|/)node_modules/' > "$RUNNER_TEMP/built.txt"
          wc -l "$RUNNER_TEMP/built.txt"
          tar -czf "$RUNNER_TEMP/built.tgz" -T "$RUNNER_TEMP/built.txt"
          ls -lh "$RUNNER_TEMP/built.tgz"

      - uses: actions/upload-artifact@v5
        with:
          name: built
          path: ${{ runner.temp }}/built.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # THREE SHARDS, EACH WITH ITS OWN SERVICES. One runner ran every test in a single process (~5 of a
  # ~7 minute job). `vitest --shard=N/3` splits the test FILES three ways; each shard provisions its
  # own Postgres, Redis and MySQL containers, so no suite can see another shard's tables or rows.
  # Every file lands in exactly one shard. `test` below is the required check: it stays named `test`.
  shard:
    name: Test shard ${{ matrix.shard }}/3
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # A red shard must not cancel the others: the failing shard's log is the one to read, and the
      # other two finishing says whether the failure is isolated.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Service images come from Google's mirror of Docker Hub's official images. Pulled from Docker Hub
    # itself they are anonymous, and the CI runners share one address: once the hourly allowance is
    # spent, every job fails at `docker pull` before a single test runs.
    services:
      # The tenant suites need a REAL PostgreSQL: row-level security is a property of the server, and
      # the driver's own fallbacks would make a mock agree with whatever it was told.
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fromcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # A job surviving the process that enqueued it, a failed job being retried, and a failure being
      # audible are all properties of the broker rather than of the adapter class.
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Every bug the MySQL read suite guards was silent: `find()` returning the first row instead of
      # the rows, `count()` answering 0 for every table. None is visible without a server.
      mysql:
        image: mirror.gcr.io/library/mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out the framework
        uses: actions/checkout@v5

      # 22, matching NODE_BASE_IMAGE in the Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The build output comes from the `build` job. It is unpacked AFTER `npm ci`, which owns
      # `node_modules` and would not touch it, but the workspace links there point at these `dist`s.
      - uses: actions/download-artifact@v5
        with:
          name: built
          path: ${{ runner.temp }}

      - name: Unpack the build output
        run: tar -xzf "$RUNNER_TEMP/built.tgz"

      # The two logins tenant isolation is defined in terms of: an owner that runs DDL, and a runtime
      # role that is NOSUPERUSER / NOBYPASSRLS — without which every policy is decorative and every
      # case in the suite would pass for the wrong reason.
      - name: Provision the database roles
        env:
          DATABASE_BOOTSTRAP_URL: postgresql://postgres:postgres@127.0.0.1:5432/fromcode
          DATABASE_URL: postgresql://fromcode_app:app_ci_only@127.0.0.1:5432/fromcode
          DATABASE_MIGRATION_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
        run: node packages/cli/dist/bin.js db bootstrap-roles

      - name: Migrate
        env:
          DATABASE_URL: postgresql://fromcode_app:app_ci_only@127.0.0.1:5432/fromcode
          DATABASE_MIGRATION_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
        run: node packages/cli/dist/bin.js db migrate

      # Only the suites' OWN variables are exported here. `DATABASE_URL` deliberately is not: it would
      # be visible to all 3,053 tests, and a unit test that quietly reached a real database instead of
      # its fixture is exactly the kind of accident this file is meant to prevent.
      - name: Run the suite (shard ${{ matrix.shard }}/3)
        env:
          TENANT_TEST_DATABASE_URL: postgresql://fromcode_app:app_ci_only@127.0.0.1:5432/fromcode
          TENANT_TEST_OWNER_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
          # The own query layer's rows against a real Postgres; the suites create and drop their own tables.
          DB_READ_TEST_DATABASE_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
          QUEUE_TEST_REDIS_URL: redis://127.0.0.1:6379
          REDIS_TEST_URL: redis://127.0.0.1:6379
          MYSQL_TEST_URL: mysql://root:rootpw@127.0.0.1:3306/mysql
        # A shared runner is sometimes several times slower than usual; at the 5 s default a correct
        # suite then fails on timeouts alone and has to be run again from the start.
        run: npm run test:framework -- --testTimeout=30000 --shard=${{ matrix.shard }}/3

  # The single check that means "every test passed". It is named `test`, the name this workflow's job
  # always had, so a branch rule or reviewer looking for `Tests / test` still finds it. `always()` so a
  # failed or cancelled shard turns it red instead of leaving it skipped, which reads as neutral.
  test:
    name: test
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
