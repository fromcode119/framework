# Runs the framework's own test suite.
#
# WHY THIS EXISTS: nothing ran it. The repository had four workflows — guards, tagging, attribution
# and images — and not one of them invoked vitest, so 3,053 tests existed and none of them had an
# opinion about a pull request. `Arch guard` is a static gate; it type-checks and measures structure,
# and says nothing about behaviour.
#
# AND WHY IT BRINGS SERVICES: 34 of those tests are integration suites that SKIP unless the thing they
# test is reachable, which is the honest design — a green run against no database is worse than no
# test. But skipping was the only thing that ever happened, including for `tenant-isolation`, which is
# the proof that row-level security keeps one customer's rows away from another. The services below
# are what turn "skipped" into "passed".
name: Tests

#
# PULL REQUESTS ONLY: a squash merge lands exactly the tree its pull request already passed, so a second
# run on main repeated the same minutes before every release. The arch guards and the attribution check
# still run on main as well.
on:
  pull_request:

jobs:
  # A release pull request moves the version and nothing else: `package.json`, `package-lock.json` and
  # the changelog. The tree it tests is the tree main already passed, so the suite can only reach the
  # same verdict — and reaching it costs five minutes and three sets of service containers before every
  # release. This job reads the actual diff and says whether anything a test could see changed.
  #
  # STRICTER THAN `Arch guard`'s copy of this, deliberately: there a workflow file is ignorable, because
  # no guard reads one. Here `.github/**` counts as a change, so that a pull request editing THIS file
  # still runs the suite it is editing. A version-only release touches no workflow, so it still skips.
  #
  # When in doubt — no base commit to compare against, a new branch, a file that will not parse — it
  # runs the tests.
  scope:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.diff.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Is anything more than the version changing?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          tests=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            only_version=true
            [ -z "$files" ] && only_version=false
            for f in $files; do
              case "$f" in
                CHANGELOG.md) ;;
                package.json|package-lock.json)
                  # Everything except the version itself, so a dependency or a script added in the same
                  # commit is still a change: the lock file carries its own copy under `.packages[""]`.
                  strip='del(.version) | if .packages then .packages[""] |= del(.version) else . end'
                  a=$(git show "$BASE:$f" 2>/dev/null | jq -S "$strip") || a=missing-a
                  b=$(git show "HEAD:$f" 2>/dev/null | jq -S "$strip") || b=missing-b
                  [ "$a" = "$b" ] || only_version=false ;;
                *) only_version=false ;;
              esac
            done
            [ "$only_version" = true ] && tests=false
            echo "Changed: $(echo $files)"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Run the suite: $tests"

  # SIX SHARDS, EACH WITH ITS OWN SERVICES. One runner ran every test in a single process (~5 of a
  # ~7 minute job); three shards brought the suite itself to ~2m09. `vitest --shard=N/6` splits the test
  # FILES six ways, and each shard provisions its own Postgres, Redis and MySQL containers, so no suite
  # can see another shard's tables or rows. Six rather than three because this repository is PUBLIC:
  # GitHub-hosted minutes cost nothing here, so the only price of another shard is its own setup, which
  # runs in parallel with the rest. Every file lands in exactly one shard. `test` below is the check
  # that means "the suite passed": it stays named `test`.
  shard:
    name: Test shard ${{ matrix.shard }}/6
    needs: scope
    if: ${{ needs.scope.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # A red shard must not cancel the others: the failing shard's log is the one to read, and the
      # other two finishing says whether the failure is isolated.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    # Service images come from Google's mirror of Docker Hub's official images. Pulled from Docker Hub
    # itself they are anonymous, and the CI runners share one address: once the hourly allowance is
    # spent, every job fails at `docker pull` before a single test runs.
    services:
      # The tenant suites need a REAL PostgreSQL: row-level security is a property of the server, and
      # the driver's own fallbacks would make a mock agree with whatever it was told.
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fromcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # A job surviving the process that enqueued it, a failed job being retried, and a failure being
      # audible are all properties of the broker rather than of the adapter class.
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Every bug the MySQL read suite guards was silent: `find()` returning the first row instead of
      # the rows, `count()` answering 0 for every table. None is visible without a server.
      mysql:
        image: mirror.gcr.io/library/mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out the framework
        uses: actions/checkout@v5

      # 22, matching NODE_BASE_IMAGE in the Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The suite imports BUILT output for the packages that ship as `dist` (core, react, sdk), the
      # same reason the guard workflow builds them. A CI checkout starts without any of them.
      - name: Build the packages the tests import
        run: npm run build:packages

      # The storefront runtime bundle is a build ARTIFACT, and `frontend-runtime-bundle.test.ts`
      # deliberately fails when it has not been built — it guards the bundle's contents and its size
      # ratchet, neither of which means anything against a stale or absent file.
      - name: Build the storefront runtime bundle
        run: npm run build:frontend-runtime

      # `fromcode db` — the roles and migrations below run through the framework's own commands rather
      # than a SQL fixture kept beside them, so what CI sets up cannot drift from what a deployment does.
      - name: Build the CLI
        run: npm run build --workspace=@fromcode119/cli

      # The two logins tenant isolation is defined in terms of: an owner that runs DDL, and a runtime
      # role that is NOSUPERUSER / NOBYPASSRLS — without which every policy is decorative and every
      # case in the suite would pass for the wrong reason.
      - name: Provision the database roles
        env:
          DATABASE_BOOTSTRAP_URL: postgresql://postgres:postgres@127.0.0.1:5432/fromcode
          DATABASE_URL: postgresql://fromcode_app:app_ci_only@127.0.0.1:5432/fromcode
          DATABASE_MIGRATION_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
        run: node packages/cli/dist/bin.js db bootstrap-roles

      - name: Migrate
        env:
          DATABASE_URL: postgresql://fromcode_app:app_ci_only@127.0.0.1:5432/fromcode
          DATABASE_MIGRATION_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
        run: node packages/cli/dist/bin.js db migrate

      # Only the suites' OWN variables are exported here. `DATABASE_URL` deliberately is not: it would
      # be visible to all 3,053 tests, and a unit test that quietly reached a real database instead of
      # its fixture is exactly the kind of accident this file is meant to prevent.
      - name: Run the suite (shard ${{ matrix.shard }}/6)
        env:
          TENANT_TEST_DATABASE_URL: postgresql://fromcode_app:app_ci_only@127.0.0.1:5432/fromcode
          TENANT_TEST_OWNER_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
          # The own query layer's rows against a real Postgres; the suites create and drop their own tables.
          DB_READ_TEST_DATABASE_URL: postgresql://fromcode_owner:owner_ci_only@127.0.0.1:5432/fromcode
          QUEUE_TEST_REDIS_URL: redis://127.0.0.1:6379
          REDIS_TEST_URL: redis://127.0.0.1:6379
          MYSQL_TEST_URL: mysql://root:rootpw@127.0.0.1:3306/mysql
        # A shared runner is sometimes several times slower than usual; at the 5 s default a correct
        # suite then fails on timeouts alone and has to be run again from the start.
        run: npm run test:framework -- --testTimeout=30000 --shard=${{ matrix.shard }}/6

  # The single check that means "every test passed". It is named `test`, the name this workflow's job
  # always had, so a branch rule or reviewer looking for `Tests / test` still finds it. `always()` so a
  # failed or cancelled shard turns it red instead of leaving it skipped, which reads as neutral.
  test:
    name: test
    needs: [scope, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        env:
          RAN: ${{ needs.scope.outputs.tests }}
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "scope says run the suite: $RAN"
          echo "shards: $RESULT"
          # Skipped ON PURPOSE (a version-only release) is a pass: the tree is the one main tested.
          # Skipped for any other reason, or `scope` itself failing, is not — then $RAN is not 'false'
          # and the shards' own result has to be `success`.
          if [ "$RAN" = false ] && [ "$RESULT" = skipped ]; then
            echo "Only the version changed: the suite already passed on this tree."
            exit 0
          fi
          test "$RESULT" = success
