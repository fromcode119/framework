# Runs every architecture guard in one pass and FAILS the run if any of them fails.
#
# WHY THIS EXISTS: ~40 guards existed and nothing ran them. They were reachable only as individual npm
# scripts, fifteen of which `npm run build` chained — and the Dockerfile calls the granular build
# targets (`build:tooling`, `build:libs`, `build:admin`, …), never `npm run build`. So the images built
# green while guards were failing, the ratchets stopped ratcheting, and their baselines quietly became
# permission instead of debt anyone was paying down.
#
# SCOPE: this job guards the FRAMEWORK. A plugin, theme or appearance guards ITSELF, in its own
# repository, by calling the reusable job below — which is why the framework holds no list of their
# names. See `GuardScope`.
name: Arch guard

on:
  pull_request:
  push:
    branches:
      - main

  # Called by an extension repository to guard itself with these rules. It passes WHERE it sits in the
  # tree (`plugins`, `themes` or `appearance`) and under what directory name; the job assembles the
  # layout the guards expect and points them at that directory alone.
  workflow_call:
    inputs:
      area:
        description: 'plugins | themes | appearance'
        required: true
        type: string
      name:
        description: "The extension's directory name, e.g. the plugin slug"
        required: true
        type: string
      framework-ref:
        description: 'Framework ref to guard against (default: main)'
        required: false
        default: main
        type: string
      # A private repository pays for GitHub-hosted minutes; a public one does not. The caller picks
      # the machine, so a private extension can run on the organisation's own runner.
      runner:
        description: 'runs-on label (default: ubuntu-latest)'
        required: false
        default: ubuntu-latest
        type: string

jobs:
  # A release is a separate commit that only moves the version: `manifest.json`'s `version`, the same
  # field in `package.json` / `package-lock.json`, and the changelog. No guard can read a different
  # result from that, so running all of them again only holds the queue. This job decides, from the
  # actual diff, whether anything else changed. Any other file — or any other key in those files, since
  # the guards DO read manifest slots and package scripts — runs the full guard. When in doubt (no base
  # to compare, a new branch, the framework's own runs) it runs.
  scope:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      guard: ${{ steps.diff.outputs.guard }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.area != '' }}
        with:
          fetch-depth: 0
      - name: Is anything more than the version changing?
        id: diff
        env:
          CALLED: ${{ inputs.area != '' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          guard=true
          if [ "$CALLED" = true ] && [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            only_version=true
            [ -z "$files" ] && only_version=false
            for f in $files; do
              case "$f" in
                CHANGELOG.md) ;;
                manifest.json|package.json|package-lock.json)
                  strip='del(.version) | if .packages then .packages[""] |= del(.version) else . end'
                  a=$(git show "$BASE:$f" 2>/dev/null | jq -S "$strip") || a=missing-a
                  b=$(git show "HEAD:$f" 2>/dev/null | jq -S "$strip") || b=missing-b
                  [ "$a" = "$b" ] || only_version=false ;;
                *) only_version=false ;;
              esac
            done
            [ "$only_version" = true ] && guard=false
            echo "Changed: $(echo $files)"
          fi
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
          echo "Run the guards: $guard"

  guard:
    needs: scope
    if: ${{ needs.scope.outputs.guard == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      # The guards resolve a repo root holding `framework/Source` beside `plugins/`, `themes/` and
      # `appearance/`, so both checkouts go to the paths that reproduce it.
      # `framework/Source`, not `framework`: this repository's ROOT is the framework's `Source`
      # directory — `packages/`, the Dockerfile and `package-lock.json` sit at the top of it. Checking
      # it out to `framework` put every one of them one level above where the rest of this job looks,
      # so `cache-dependency-path` resolved nothing and the run died at setup-node before a single
      # guard ran. Nothing caught it because this workflow had never executed until now.
      # "Called by an extension" is `inputs.area` being set — inputs exist only under workflow_call.
      # NOT `github.event_name == 'workflow_call'`: inside a called workflow `github` is the CALLER's
      # context, so event_name is the caller's trigger (`pull_request`, `push`) and that test is never
      # true. The first extension to call this job got its OWN repository checked out as the framework
      # and died at setup-node with no package-lock — having guarded nothing.
      - name: Check out the framework
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.area != '' && 'fromcode119/framework' || github.repository }}
          ref: ${{ inputs.area != '' && inputs.framework-ref || github.ref }}
          path: framework/Source

      - name: Check out the extension
        if: ${{ inputs.area != '' }}
        uses: actions/checkout@v5
        with:
          path: ${{ inputs.area }}/${{ inputs.name }}

      # 22, matching NODE_BASE_IMAGE in the Dockerfile — the guards must run on the version the
      # images are built with, and there is no .nvmrc to read it from.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: framework/Source/package-lock.json

      # On the organisation's own runner the installed and built framework is kept between jobs, keyed
      # by commit. Every extension guards against the same framework commit, and install + build is
      # about two thirds of a job, so the second repository onwards starts from the finished tree.
      # GitHub-hosted runners start empty every time; there the steps below are skipped.
      - name: Restore the built framework
        id: built
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          CACHE_ROOT: ${{ runner.tool_cache }}/fromcode-framework
        run: |
          sha=$(git -C framework/Source rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -d "$CACHE_ROOT/$sha" ]; then
            tar -C "$CACHE_ROOT/$sha" -cf - . | tar -C framework/Source -xf -
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: ${{ steps.built.outputs.hit != 'true' }}
        working-directory: framework/Source
        run: npm ci

      # `build:packages` — tooling, runtime, the generated icon list and the libraries — because the
      # guards measure BUILT output as well as source, exactly as the Dockerfile does:
      #   - arch-guard imports typor's `build` entry, and typor is consumed as built output;
      #   - `app-typecheck` type-checks admin and frontend, which resolve core/react/sdk from `dist`;
      #   - `imports` resolves `lucide-icon-names.generated.json`, which `build:frontend-icons` emits
      #     and nothing commits.
      # Locally none of this showed, because every one of those directories has been on disk for
      # months. A fresh checkout is the only place the difference is visible.
      - name: Build the packages the guards measure
        if: ${{ steps.built.outputs.hit != 'true' }}
        working-directory: framework/Source
        run: npm run build:packages

      # Written to a temporary name and renamed, so a job running beside this one never reads half a
      # tree. Only the three newest commits are kept.
      - name: Keep the built framework
        if: ${{ runner.environment == 'self-hosted' && steps.built.outputs.hit != 'true' }}
        env:
          CACHE_ROOT: ${{ runner.tool_cache }}/fromcode-framework
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          mkdir -p "$CACHE_ROOT"
          tmp="$CACHE_ROOT/.partial-$GITHUB_RUN_ID-$GITHUB_JOB"
          mkdir -p "$tmp"
          tar -C framework/Source --exclude=./.git -cf - . | tar -C "$tmp" -xf -
          mv -T "$tmp" "$CACHE_ROOT/$SHA" 2>/dev/null || rm -rf "$tmp"
          ls -1dt "$CACHE_ROOT"/*/ | tail -n +4 | xargs -r rm -rf

      # A plugin UI may import its OWN packages (a chart or tree library, say), declared in
      # its `src/ui/package.json` with a lockfile. `plugin-ui-types` typechecks that UI, so without those
      # installed every such import is "Cannot find module" and the guard fails on code that builds fine.
      # Locally it never showed, because the checkout already had `src/ui/node_modules`.
      # `--ignore-scripts`: nothing needs to run, only the type declarations have to be there.
      - name: Install the extension's own UI dependencies
        if: ${{ inputs.area != '' }}
        env:
          GUARD_AREA: ${{ inputs.area }}
          GUARD_NAME: ${{ inputs.name }}
        run: |
          ui="$GUARD_AREA/$GUARD_NAME/src/ui"
          if [ -f "$ui/package-lock.json" ]; then
            npm ci --prefix "$ui" --ignore-scripts --no-audit --no-fund
          fi

      - name: Build the guards
        working-directory: framework/Source
        run: npm run build --workspace=@fromcode119/arch-guard

      # `--scope` decides the subject, never the rules. Unquoted interpolation is avoided: the area and
      # name are passed as environment values so a caller cannot inject shell through them.
      - name: Run the guards
        working-directory: framework/Source
        env:
          GUARD_AREA: ${{ inputs.area }}
          GUARD_NAME: ${{ inputs.name }}
        run: |
          if [ -n "$GUARD_AREA" ]; then
            scope="$(cd "../../$GUARD_AREA/$GUARD_NAME" && pwd)"
          else
            scope=framework
          fi
          node packages/arch-guard/dist/arch-guard-cli.cjs ci --scope "$scope"
